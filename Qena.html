    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #0a1a3a, #1a3a5f, #2a5a8f); color: #fff; overflow: hidden; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { display: flex; height: 100vh; }
        .info-section { flex: 3; background: rgba(10, 26, 58, 0.85); padding: 20px; overflow-y: auto; border-left: 2px solid rgba(100, 180, 255, 0.3); }
        .map-section { flex: 7; position: relative; }
        
        /* زر الرجوع للصفحة الرئيسية */
        .home-button {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1001;
            background: linear-gradient(135deg, #1a5ca8, #64b4ff);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3), 0 0 20px rgba(100, 180, 255, 0.5);
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: pulse-home 2s infinite;
            overflow: hidden;
        }
        
        .home-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: 0.5s;
        }
        
        .home-button:hover::before {
            left: 100%;
        }
        
        .home-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), 0 0 30px rgba(100, 180, 255, 0.7);
            background: linear-gradient(135deg, #64b4ff, #1a5ca8);
        }
        
        .home-button:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3), 0 0 15px rgba(100, 180, 255, 0.5);
        }
        
        .home-button i {
            font-size: 18px;
            transition: transform 0.3s ease;
        }
        
        .home-button:hover i {
            transform: scale(1.2) rotate(-10deg);
        }
        
        @keyframes pulse-home {
            0% { box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3), 0 0 20px rgba(100, 180, 255, 0.5); }
            50% { box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4), 0 0 30px rgba(100, 180, 255, 0.7); }
            100% { box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3), 0 0 20px rgba(100, 180, 255, 0.5); }
        }
        
        header { text-align: center; padding: 15px 0; margin-bottom: 20px; border-bottom: 2px solid rgba(100, 180, 255, 0.3); }
        h1 { font-size: 2.2rem; margin-bottom: 10px; text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.5); 
             background: linear-gradient(to right, #64b4ff, #a6d0ff, #64b4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { font-size: 1.1rem; color: #c0d8ff; margin-bottom: 15px; }
        .logos { display: flex; justify-content: center; gap: 20px; margin: 15px 0; }
        .logo { width: 70px; height: 70px; border-radius: 50%; border: 2px solid #64b4ff; box-shadow: 0 0 15px rgba(100, 180, 255, 0.7); }
        #satelliteMap { width: 100%; height: 100%; }
        .landmarks-list { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .landmark-item { background: rgba(100, 180, 255, 0.1); border-radius: 10px; padding: 15px; transition: all 0.3s ease; 
                    border: 1px solid rgba(100, 180, 255, 0.2); cursor: pointer; }
        .landmark-item:hover { transform: translateY(-3px); background: rgba(100, 180, 255, 0.15); box-shadow: 0 5px 15px rgba(100, 180, 255, 0.2); }
        .landmark-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .landmark-icon { font-size: 1.5rem; }
        .landmark-name { font-size: 1.1rem; color: #a6d0ff; font-weight: bold; }
        .landmark-details { display: flex; flex-direction: column; gap: 5px; font-size: 0.9rem; color: #c0d8ff; }
        .landmark-detail { display: flex; align-items: center; gap: 5px; }
        .map-controls { position: absolute; top: 20px; right: 20px; z-index: 1000; background: rgba(10, 26, 58, 0.8); 
                      border-radius: 10px; padding: 15px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3); 
                      border: 1px solid rgba(100, 180, 255, 0.3); backdrop-filter: blur(5px); }
        .map-controls h3 { color: #64b4ff; margin-bottom: 10px; font-size: 1.1rem; text-align: center; }
        .control-btn { display: block; width: 100%; padding: 8px; margin-bottom: 8px; background: rgba(100, 180, 255, 0.2); 
                      border: 1px solid rgba(100, 180, 255, 0.4); color: white; border-radius: 5px; cursor: pointer; 
                      transition: all 0.3s ease; text-align: center; }
        .control-btn:hover { background: rgba(100, 180, 255, 0.4); transform: translateY(-2px); }
        .legend { position: absolute; bottom: 20px; left: 20px; z-index: 1000; background: rgba(10, 26, 58, 0.8); 
                 border-radius: 10px; padding: 15px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3); 
                 border: 1px solid rgba(100, 180, 255, 0.3); backdrop-filter: blur(5px); color: white; }
        .legend h3 { color: #64b4ff; margin-bottom: 10px; font-size: 1.1rem; text-align: center; }
        .legend-item { display: flex; align-items: center; margin-bottom: 8px; }
        .legend-color { width: 20px; height: 20px; border-radius: 50%; margin-left: 10px; border: 1px solid white; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(100, 180, 255, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(100, 180, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(100, 180, 255, 0); } }
        .floating-panel { position: absolute; top: 20px; left: 20px; z-index: 1000; background: rgba(10, 26, 58, 0.8); 
                         border-radius: 10px; padding: 15px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3); 
                         border: 1px solid rgba(100, 180, 255, 0.3); backdrop-filter: blur(5px); color: white; max-width: 300px; }
        .floating-panel h3 { color: #64b4ff; margin-bottom: 10px; font-size: 1.1rem; text-align: center; }
        .location-btn { display: block; width: 100%; padding: 8px; margin-bottom: 8px; background: rgba(100, 180, 255, 0.2); 
                       border: 1px solid rgba(100, 180, 255, 0.4); color: white; border-radius: 5px; cursor: pointer; 
                       transition: all 0.3s ease; text-align: center; }
        .location-btn:hover { background: rgba(100, 180, 255, 0.4); transform: translateY(-2px); }
        .signature { margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(100, 180, 255, 0.3); text-align: center; }

        .custom-icon { background: rgba(255, 255, 255, 0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center;

        .custom-popup { background: rgba(10, 26, 58, 0.95); color: white; border-radius: 10px; padding: 15px;

        .popup-icon { width: 20px; text-align: center; }

                font-size: 14px;

        // إعداد الخريطة
        const map = L.map('satelliteMap').setView([26.155, 32.716], 10);
        
        // إضافة طبقة الخريطة الفضائية من Google
        const satelliteLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: 'Google Satellite'
        }).addTo(map);
        
        // إضافة طبقة الخريطة الهجينة
        const hybridLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: 'Google Hybrid'
        });
        
        // إضافة طبقة الطرق
        const roadLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: 'Google Roads'
        });
        
        // إضافة عناصر تحكم الطبقات
        const baseMaps = {
            "الخريطة الفضائية": satelliteLayer,
            "الخريطة الهجينة": hybridLayer,
            "خريطة الطرق": roadLayer
        };
        
        L.control.layers(baseMaps).addTo(map);

        // إنشاء أيقونات مخصصة
        function createCustomIcon(type, isPulsing = false) {
            let iconHtml, iconColor;
            
            switch(type) {
                case 'خدمي':
                    iconHtml = '🏢';
                    iconColor = '#1a5ca8';
                    break;
                case 'سياحي':
                    iconHtml = '🏨';
                    iconColor = '#ff9800';
                    break;
                case 'زراعي':
                    iconHtml = '🌾';
                    iconColor = '#4caf50';
                    break;
                case 'صناعي':
                    iconHtml = '🏭';
                    iconColor = '#607d8b';
                    break;
                default:
                    iconHtml = '📍';
                    iconColor = '#9e9e9e';
            }
            
            const className = isPulsing ? 'custom-icon pulse' : 'custom-icon';
            
            return L.divIcon({
                className: className,
                html: `<div style="background: ${iconColor}; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; color: white; box-shadow: 0 0 10px ${iconColor};">${iconHtml}</div>`,
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            });
        }

        // إضافة خطوط إلى الخريطة
        const lines = [];
        linesData.features.forEach(feature => {
            try {
                const coordinates = feature.geometry.coordinates.map(coord => [coord[1], coord[0]]);
                
                const line = L.polyline(coordinates, {
                    color: '#9c27b0',
                    weight: 3,
                    opacity: 0.8
                }).addTo(map);
                
                // ربط المعلومات مع الخط
                line.bindPopup(createLinePopupContent(feature.properties));
                
                line.feature = feature;
                line.type = 'line';
                lines.push(line);
                
                // إضافة تأثيرات تفاعلية
                line.on('mouseover', function() {
                    this.setStyle({weight: 6, opacity: 1});
                });
                
                line.on('mouseout', function() {
                    this.setStyle({weight: 3, opacity: 0.8});
                });
                
            } catch (error) {
                console.error('Error adding line:', error, feature);
            }
        });

        // إضافة المضلعات إلى الخريطة
        const polygons = [];
        polygonsData.features.forEach(feature => {
            try {
                const coordinates = feature.geometry.coordinates[0].map(coord => [coord[1], coord[0]]);
                
                if (coordinates.length < 3) {
                    console.error('Not enough coordinates to form a polygon', feature);
                    return;
                }
                
                const color = getColorByType(feature.properties.FolderPath);
                
                const polygon = L.polygon(coordinates, {
                    color: color,
                    fillColor: color,
                    fillOpacity: 0.3,
                    weight: 2
                }).addTo(map);
                
                // إضافة تسمية
                const centroid = getPolygonCentroid(coordinates);
                const label = L.marker(centroid, {
                    icon: L.divIcon({
                        className: 'polygon-label',
                        html: `<div style="background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; white-space: nowrap;">${feature.properties.Name}</div>`,
                        iconSize: [null, null],
                        iconAnchor: [0, 0]
                    })
                }).addTo(map);
                
                polygon.label = label;
                
                // ربط المعلومات مع المضلع
                polygon.bindPopup(createPolygonPopupContent(feature.properties));
                
                polygon.feature = feature;
                polygon.type = 'polygon';
                polygons.push(polygon);
                
                // إضافة تأثيرات تفاعلية
                polygon.on('mouseover', function() {
                    this.setStyle({fillOpacity: 0.6, weight: 4});
                });
                
                polygon.on('mouseout', function() {
                    this.setStyle({fillOpacity: 0.3, weight: 2});
                });
                
            } catch (error) {
                console.error('Error adding polygon:', error, feature);
            }
        });
        
        // تحديد لون العنصر بناءً على نوعه
        function getColorByType(folderPath) {
            if (folderPath.includes('شوارع')) return '#9c27b0';
            if (folderPath.includes('مناطق_تطوير')) return '#ff5722';
            if (folderPath.includes('مواقف')) return '#2196f3';
            if (folderPath.includes('المسجد')) return '#4caf50';
            if (folderPath.includes('مقابر')) return '#795548';
            return '#9e9e9e';
        }
        
        // حساب المركز الهندسي للمضلع
        function getPolygonCentroid(coords) {
            let x = 0, y = 0;
            for (let i = 0; i < coords.length; i++) {
                x += coords[i][0];
                y += coords[i][1];
            }
            return [x / coords.length, y / coords.length];
        }
        
        // إنشاء محتوى البوب أب للخطوط
        function createLinePopupContent(properties) {
            return `
                <div class="custom-popup">
                    <div class="popup-header">
                        <div class="popup-title">${properties.Name}</div>
                    </div>
                    <div class="popup-details">
                        <div class="popup-detail">
                            <span class="popup-icon">📏</span>
                            <span>الطول: ${properties.Shape_Length.toFixed(6)}</span>
                        </div>
                        <div class="popup-detail">
                            <span class="popup-icon">📁</span>
                            <span>${properties.FolderPath}</span>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // إنشاء محتوى البوب أب للمضلعات
        function createPolygonPopupContent(properties) {
            return `
                <div class="custom-popup">
                    <div class="popup-header">
                        <div class="popup-title">${properties.Name}</div>
                    </div>
                    <div class="popup-details">
                        <div class="popup-detail">
                            <span class="popup-icon">📏</span>
                            <span>المساحة: ${properties.Shape_Area ? properties.Shape_Area.toFixed(8) : 'غير معروف'}</span>
                        </div>
                        <div class="popup-detail">
                            <span class="popup-icon">📐</span>
                            <span>المحيط: ${properties.Shape_Length.toFixed(6)}</span>
                        </div>
                        <div class="popup-detail">
                            <span class="popup-icon">📁</span>
                            <span>${properties.FolderPath}</span>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // إنشاء قائمة المعالم
        function createLandmarksList() {
            const landmarksList = document.getElementById('landmarksList');
            landmarksList.innerHTML = '';
            
            // دمج الخطوط والمضلعات في قائمة واحدة
            const allLandmarks = [...lines, ...polygons];
            
            allLandmarks.forEach(landmark => {
                const feature = landmark.feature;
                const properties = feature.properties;
                
                const landmarkItem = document.createElement('div');
                landmarkItem.className = 'landmark-item';
                
                let icon, type;
                if (landmark.type === 'line') {
                    icon = '🛣️';
                    type = 'شارع';
                } else {
                    icon = '🗺️';
                    type = 'منطقة';
                }
                
                landmarkItem.innerHTML = `
                    <div class="landmark-header">
                        <span class="landmark-icon">${icon}</span>
                        <span class="landmark-name">${properties.Name}</span>
                    </div>
                    <div class="landmark-details">
                        <div class="landmark-detail">
                            <span>${type}</span>
                        </div>
                        <div class="landmark-detail">
                            <span>${properties.FolderPath.split('/').pop()}</span>
                        </div>
                    </div>
                `;
                
                landmarkItem.addEventListener('click', function() {
                    if (landmark.type === 'line') {
                        // للخطوط، نركز على الخط بأكمله
                        const bounds = landmark.getBounds();
                        map.fitBounds(bounds);
                    } else {
                        // للمضلعات، نفتح البوب أب في المركز الهندسي
                        const centroid = getPolygonCentroid(feature.geometry.coordinates[0].map(coord => [coord[1], coord[0]]));
                        map.setView(centroid, 16);
                        setTimeout(() => {
                            landmark.openPopup();
                        }, 500);
                    }
                });
                
                landmarksList.appendChild(landmarkItem);
            });
        }
        
        // إضافة وظيفة البحث
        function setupSearch() {
            const searchInput = document.getElementById('landmarkSearch');
            
            searchInput.addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase();
                const landmarks = document.querySelectorAll('.landmark-item');
                
                landmarks.forEach(landmark => {
                    const name = landmark.querySelector('.landmark-name').textContent.toLowerCase();
                    const details = landmark.querySelector('.landmark-details').textContent.toLowerCase();
                    
                    if (name.includes(searchTerm) || details.includes(searchTerm)) {
                        landmark.style.display = 'block';
                    } else {
                        landmark.style.display = 'none';
                    }
                });
            });
        }
        
        // إضافة وظائف التحكم في الخريطة
        document.getElementById('zoomInBtn').addEventListener('click', function() {
            map.zoomIn();
        });
        
        document.getElementById('zoomOutBtn').addEventListener('click', function() {
            map.zoomOut();
        });
        
        document.getElementById('resetViewBtn').addEventListener('click', function() {
            map.setView([26.155, 32.716], 10);
        });
        
        document.getElementById('toggleSatelliteBtn').addEventListener('click', function() {
            if (map.hasLayer(satelliteLayer)) {
                map.removeLayer(satelliteLayer);
                hybridLayer.addTo(map);
            } else if (map.hasLayer(hybridLayer)) {
                map.removeLayer(hybridLayer);
                roadLayer.addTo(map);
            } else {
                map.removeLayer(roadLayer);
                satelliteLayer.addTo(map);
            }
        });
        
        // إضافة وظائف الانتقال للمواقع
        document.querySelectorAll('.location-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const lat = parseFloat(this.getAttribute('data-lat'));
                const lng = parseFloat(this.getAttribute('data-lng'));
                const zoom = parseInt(this.getAttribute('data-zoom'));
                map.setView([lat, lng], zoom);
            });
        });
        
        // تهيئة القائمة والبحث
        createLandmarksList();
        setupSearch();
    </script>
</body>
</html>
