<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>فرص استثمارية - قنا</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"> 

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"> 

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"> 

  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      margin: 0;
      background-color: #f8f9fa;
    }

    header {
      background: #004d40;
      color: white;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    header h1 {
      font-size: 1.2rem;
      margin: 0;
      flex-grow: 1;
    }

    header img {
      height: 60px;
      width: 60px;
      object-fit: contain;
      border-radius: 0;
      background: white;
      padding: 4px;
      box-sizing: border-box;
    }

    #map {
      height: 90vh;
      width: 100%;
    }

    .leaflet-popup-content img {
      max-width: 250px;
      border-radius: 8px;
    }

    /* أداة القياس الجانبية */
    .measure-panel {
      position: absolute;
      left: 10px;
      top: 10px;
      z-index: 1000;
      background: white;
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .measure-btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .measure-btn:hover {
      background: #0056b3;
    }

    .measure-result {
      background: #f1f1f1;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      text-align: center;
    }
    /* عرض رقم المسافة والمساحة */
.distance-label .leaflet-div-icon {
  background-color: transparent !important;
  border: none !important;
}
  </style>
</head>
<body>

  <!-- Header with logos -->
  <header class="text-white">
    <img src="https://i.ibb.co/fYrDg2P1/gov-logo.jpg"  alt="شعار المحافظة" onerror="this.src='https://via.placeholder.com/60x60?text=Gov+Logo'">
    <h1>الفرص الاستثمارية في محافظة قنا</h1>
    <img src="https://i.ibb.co/fd3Kgbsj/gis-logo.png" alt="شعار الموقع" onerror="this.src='https://via.placeholder.com/60x60?text=GIS+Logo'">
  </header>

  <!-- Filters -->
  <div class="container mt-3">
    <!-- زر القياس أسفل أدوات التكبير -->
<style>
  .measure-control {
    position: absolute;
    left: 10px;
    top: 80px;
    z-index: 1000;
    background: white;
    border-radius: 6px;
    padding: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
</style>

<div class="measure-control">
  <button id="measureBtn" onclick="toggleMeasuring()" class="btn btn-outline-primary btn-sm w-100">
    <i class="bi bi-rulers"></i> بدء القياس
  </button>
</div>
    <div class="row g-2 mb-3">
      <div class="col-md-3">
        <select id="sectorFilter" class="form-select">
          <option value="">كل القطاعات</option>
          <option value="صناعي">صناعي</option>
          <option value="زراعي">زراعي</option>
          <option value="خدماتي">خدماتي</option>
        </select>
      </div>
      <div class="col-md-3">
        <select id="regionFilter" class="form-select">
          <option value="">كل المناطق</option>
          <option value="قفط">قفط</option>
          <option value="نجع حمادي">نجع حمادي</option>
          <option value="قنا">قنا</option>
        </select>
      </div>
      <div class="col-md-3">
        <select id="statusFilter" class="form-select">
          <option value="">كل الحالات</option>
          <option value="متاحة">متاحة</option>
          <option value="قيد الدراسة">قيد الدراسة</option>
        </select>
      </div>
      <div class="col-md-3">
        <input type="text" id="searchInput" class="form-control" placeholder="ابحث بالاسم...">
      </div>
      <div class="col-6">
        <button onclick="filterMarkers()" class="btn btn-primary w-100">
          <i class="bi bi-search"></i> بدء البحث
        </button>
      </div>
      <div class="col-6">
        <button onclick="resetFilters()" class="btn btn-outline-secondary w-100">
          <i class="bi bi-arrow-counterclockwise"></i> إعادة تعيين
        </button>
      </div>
    </div>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <!-- Measurement Panel -->
  <div class="measure-panel">
    <button class="measure-btn" onclick="toggleMeasuring('distance')">
      <i class="bi bi-rulers"></i> قياس مسافة
    </button>
    <button class="measure-btn" onclick="toggleMeasuring('area')">
      <i class="bi bi-diagram-3"></i> قياس مساحة
    </button>
    <div class="measure-result" id="measureResult">0 متر</div>
  </div>

  <!-- Modal Form -->
  <div class="modal fade" id="contactFormModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">طلب معلومات عن الفرصة</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="contactForm">
            <input type="hidden" id="opportunityId">
            <div class="mb-2">
              <label class="form-label">اسمك</label>
              <input type="text" id="name" class="form-control" required>
            </div>
            <div class="mb-2">
              <label class="form-label">بريدك الإلكتروني</label>
              <input type="email" id="email" class="form-control" required>
            </div>
            <div class="mb-2">
              <label class="form-label">رسالتك</label>
              <textarea id="message" class="form-control" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-success w-100">إرسال</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
  // المتغيرات العالمية
  let markers = [];
  let measuring = false;
  let polyline = null;
  let polygon = null;
  let areaLabel = null;
  let distanceLabel = null;
  let latlngs = [];
  let map;

  // دالة بدء/إنهاء القياس
  function toggleMeasuring() {
    measuring = !measuring;
    const measureBtn = document.getElementById('measureBtn');

    if (measuring) {
      measureBtn.innerHTML = '<i class="bi bi-stop-circle"></i> إنهاء القياس';

      // بدء رسم خط أو مضلع
      polyline = L.polyline([], { color: 'red', weight: 3 }).addTo(map);
      polygon = L.polygon([], { color: 'blue', fillOpacity: 0.2, stroke: false }).addTo(map);

      latlngs = [];

      // إضافة نقطة جديدة على الخريطة
      map.on('click', addPoint);

      // إنهاء القياس بالضغط المزدوج
      map.once('dblclick', () => {
        measuring = false;
        updateDistanceLabel();
        measureBtn.innerHTML = '<i class="bi bi-rulers"></i> بدء القياس';
        map.off('click', addPoint);
        if (polyline) map.removeLayer(polyline);
        if (polygon) map.removeLayer(polygon);
        if (areaLabel) map.removeLayer(areaLabel);
        if (distanceLabel) map.removeLayer(distanceLabel);
        polyline = null;
        polygon = null;
        latlngs = [];
      });

    } else {
      measureBtn.innerHTML = '<i class="bi bi-rulers"></i> بدء القياس';
      map.off('click', addPoint);
      if (polyline) map.removeLayer(polyline);
      if (polygon) map.removeLayer(polygon);
      if (areaLabel) map.removeLayer(areaLabel);
      if (distanceLabel) map.removeLayer(distanceLabel);
      polyline = null;
      polygon = null;
      latlngs = [];
    }
  }

  // إضافة نقطة عند الضغط على الخريطة
  function addPoint(e) {
    latlngs.push(e.latlng);

    // تحديث الخط
    polyline.setLatLngs(latlngs);

    // تحديث المضلع
    if (latlngs.length >= 3) {
      polygon.setLatLngs(latlngs);
      updateAreaLabel();
    }

    // حساب المسافة الإجمالية
    updateDistanceLabel();
  }

  // تحديث مساحة المضلع وإظهارها في المنتصف
  function updateAreaLabel() {
    if (areaLabel) map.removeLayer(areaLabel);
    if (latlngs.length < 3) return;

    const center = L.GeometryUtil.getCentroid(latlngs);
    const area = Math.abs(L.GeometryUtil.geodesicArea(latlngs)) / 10000; // بالمتر المربع
    areaLabel = L.marker(center, {
      icon: L.divIcon({
        className: 'distance-label',
        html: `<div style="background:white; padding:5px 10px; border-radius:4px; box-shadow:0 0 3px #0006;">${area.toFixed(2)} م²</div>`
      }),
      clickable: false
    }).addTo(map);
  }

  // تحديث المسافة وتظهر بجانب الخط
  function updateDistanceLabel() {
    if (distanceLabel) map.removeLayer(distanceLabel);
    if (latlngs.length < 2) return;

    const last = latlngs[latlngs.length - 1];
    const prev = latlngs[latlngs.length - 2];

    let total = 0;
    for (let i = 1; i < latlngs.length; i++) {
      total += map.distance(latlngs[i - 1], latlngs[i]);
    }

    distanceLabel = L.marker(last, {
      icon: L.divIcon({
        className: 'distance-label',
        html: `<div style="background:white; padding:5px 10px; border-radius:4px; box-shadow:0 0 3px #0006;">${total.toFixed(2)} متر</div>`
      }),
      clickable: false
    }).addTo(map);
  }

  // تعقب تحرك الفأرة لرسم خط مؤقت
  map.on('mousemove', e => {
    if (measuring && latlngs.length > 0) {
      const tempLine = L.polyline([latlngs[latlngs.length - 1], e.latlng], {
        color: 'red',
        dashArray: '5,5'
      }).addTo(map);
      setTimeout(() => map.removeLayer(tempLine), 200);
      updateDistanceLabel();
    }
  });
</script>

</body>
</html>
