<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>الفرص الاستثمارية - قنا</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap RTL -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --primary-color: #004d40;
      --secondary-color: #00695c;
      --accent-color: #4fc3f7;
      --warning-color: #ff9800;
      --success-color: #4caf50;
      --danger-color: #f44336;
      --gradient-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header Enhancements */
    header {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      animation: slideInFromTop 0.8s ease-out;
    }

    header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" fill="rgba(255,255,255,0.1)"><polygon points="0,0 1000,0 1000,80 0,100"/></svg>');
      background-size: cover;
      pointer-events: none;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin: 0;
      flex-grow: 1;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 2;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3), 0 0 10px rgba(79, 195, 247, 0.5); }
      to { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3), 0 0 20px rgba(79, 195, 247, 0.8), 0 0 30px rgba(79, 195, 247, 0.6); }
    }

    header img {
      height: 70px;
      width: 70px;
      object-fit: contain;
      border-radius: 50%;
      background: linear-gradient(135deg, white, #f5f5f5);
      padding: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      position: relative;
      z-index: 2;
    }

    header img:hover {
      transform: rotate(360deg) scale(1.1);
      box-shadow: 0 6px 25px rgba(79, 195, 247, 0.4);
    }

    /* Main Container */
    .main-container {
      background: rgba(255, 255, 255, 0.95);
      margin: 2rem;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      animation: slideInFromBottom 1s ease-out;
      overflow: hidden;
    }

    /* Filters Enhancement */
    .filters-section {
      background: linear-gradient(135deg, rgba(79, 195, 247, 0.1), rgba(118, 75, 162, 0.1));
      padding: 2rem;
      border-radius: 20px 20px 0 0;
      backdrop-filter: blur(10px);
    }

    .filters-title {
      text-align: center;
      color: var(--primary-color);
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      position: relative;
    }

    .filters-title::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-color), var(--secondary-color));
      border-radius: 2px;
    }

    .form-select, .form-control {
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .form-select:focus, .form-control:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(79, 195, 247, 0.2), 0 6px 20px rgba(79, 195, 247, 0.3);
      transform: translateY(-2px);
    }

    /* Enhanced Buttons */
    .btn {
      border-radius: 12px;
      padding: 12px 24px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s ease;
      z-index: -1;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-color), var(--secondary-color));
      border: none;
      box-shadow: 0 4px 15px rgba(79, 195, 247, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 25px rgba(79, 195, 247, 0.6);
    }

    .btn-outline-secondary {
      border: 2px solid var(--secondary-color);
      color: var(--secondary-color);
      background: transparent;
    }

    .btn-outline-secondary:hover {
      background: var(--secondary-color);
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 105, 92, 0.4);
    }

    /* Map Container */
    .map-container {
      position: relative;
      height: 70vh;
      border-radius: 0 0 20px 20px;
      overflow: hidden;
      box-shadow: inset 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    #map {
      height: 100%;
      width: 100%;
      border-radius: 0 0 20px 20px;
    }

    /* Enhanced Tools Panel */
    .measure-control {
      position: absolute;
      left: 20px;
      top: 20px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      width: 200px;
      animation: slideInFromLeft 1.2s ease-out;
    }

    .tools-title {
      text-align: center;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 12px;
      font-size: 0.9rem;
    }

    .measure-control .btn {
      width: 100%;
      margin-bottom: 8px;
      font-size: 0.85rem;
      padding: 10px;
      border-radius: 10px;
    }

    .btn-outline-primary {
      border: 2px solid var(--accent-color);
      color: var(--accent-color);
      background: rgba(79, 195, 247, 0.1);
    }

    .btn-outline-primary:hover {
      background: var(--accent-color);
      color: white;
      transform: scale(1.05);
    }

    .btn-outline-success {
      border: 2px solid var(--success-color);
      color: var(--success-color);
      background: rgba(76, 175, 80, 0.1);
    }

    .btn-outline-success:hover {
      background: var(--success-color);
      color: white;
      transform: scale(1.05);
    }

    .btn-outline-danger {
      border: 2px solid var(--danger-color);
      color: var(--danger-color);
      background: rgba(244, 67, 54, 0.1);
    }

    .btn-outline-danger:hover {
      background: var(--danger-color);
      color: white;
      transform: scale(1.05);
    }

    /* Floating Action Button */
    .coordinate-input-button {
      position: absolute;
      right: 20px;
      bottom: 20px;
      z-index: 1000;
      animation: bounceIn 1.5s ease-out;
    }

    .coordinate-input-button .btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: linear-gradient(135deg, var(--accent-color), var(--secondary-color));
      border: none;
      color: white;
      box-shadow: 0 8px 25px rgba(79, 195, 247, 0.4);
      transition: all 0.3s ease;
    }

    .coordinate-input-button .btn:hover {
      transform: scale(1.1) rotate(10deg);
      box-shadow: 0 12px 35px rgba(79, 195, 247, 0.6);
    }

    /* Enhanced Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      animation: fadeIn 0.3s ease;
    }

    .modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.9));
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: modalSlideIn 0.4s ease-out;
      overflow: hidden;
    }

    .modal-header {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .modal-header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="rgba(255,255,255,0.1)"><circle cx="20" cy="20" r="2"/><circle cx="80" cy="80" r="2"/><circle cx="80" cy="20" r="1"/><circle cx="20" cy="80" r="1"/></svg>');
      opacity: 0.3;
    }

    .modal-title {
      font-weight: 700;
      font-size: 1.2rem;
      position: relative;
      z-index: 2;
    }

    .btn-close {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      z-index: 2;
    }

    .btn-close:hover {
      transform: rotate(90deg) scale(1.2);
      color: var(--accent-color);
    }

    .modal-body {
      padding: 30px;
    }

    /* Display Cards */
    .display-card {
      position: absolute;
      left: 20px;
      z-index: 1000;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.9));
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      font-weight: 600;
      color: var(--primary-color);
      min-width: 200px;
      text-align: right;
    }

    #distanceDisplay {
      top: 220px;
    }

    #areaDisplay {
      top: 270px;
    }

    /* Tooltip Enhancement */
    .tooltip-custom {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1001;
      background: linear-gradient(135deg, var(--warning-color), #ff7043);
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(255, 152, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.3);
      font-weight: 600;
      animation: slideInFromRight 0.5s ease-out;
      max-width: 300px;
    }

    /* Animations */
    @keyframes slideInFromTop {
      from {
        transform: translateY(-100%);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes slideInFromBottom {
      from {
        transform: translateY(50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes slideInFromLeft {
      from {
        transform: translateX(-100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes slideInFromRight {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes bounceIn {
      0% {
        transform: scale(0.3) rotate(-180deg);
        opacity: 0;
      }
      50% {
        transform: scale(1.05) rotate(-90deg);
      }
      70% {
        transform: scale(0.9) rotate(-45deg);
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes modalSlideIn {
      from {
        transform: scale(0.7) rotate(10deg);
        opacity: 0;
      }
      to {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .main-container {
        margin: 1rem;
        border-radius: 15px;
      }

      header h1 {
        font-size: 1.4rem;
      }

      .measure-control {
        width: 160px;
        left: 10px;
        top: 10px;
      }

      .coordinate-input-button .btn {
        width: 50px;
        height: 50px;
        font-size: 20px;
      }

      .map-container {
        height: 60vh;
      }
    }

    /* Loading Animation */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<!-- Loading Overlay -->
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner"></div>
</div>

<!-- Header -->
<header class="text-white">
  <img src="https://i.ibb.co/fYrDg2P1/gov-logo.jpg" alt="شعار المحافظة"
       onerror="this.src='https://via.placeholder.com/60x60?text=Gov+Logo'">
  <h1>🏛️ الفرص الاستثمارية في محافظة قنا 🏛️</h1>
  <img src="https://i.ibb.co/fd3Kgbsj/gis-logo.png" alt="شعار الموقع"
       onerror="this.src='https://via.placeholder.com/60x60?text=GIS+Logo'">
</header>

<!-- Main Container -->
<div class="main-container">
  <!-- Filters Section -->
  <div class="filters-section">
    <h2 class="filters-title">🔍 البحث والفلترة</h2>
    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <select id="sectorFilter" class="form-select">
          <option value="">🏭 كل القطاعات</option>
          <option value="صناعي">🏭 صناعي</option>
          <option value="زراعي">🌾 زراعي</option>
          <option value="خدماتي">🏢 خدماتي</option>
        </select>
      </div>
      <div class="col-md-3">
        <select id="regionFilter" class="form-select">
          <option value="">📍 كل المناطق</option>
          <option value="دشنا">دشنا</option>
          <option value="الوقف">الوقف</option>
          <option value="نجع حمادي">نجع حمادي</option>
          <option value="فرشوط">فرشوط</option>
          <option value="أبوتشت">أبوتشت</option>
          <option value="قنا">قنا</option>
          <option value="قفط">قفط</option>
          <option value="قوص">قوص</option>
          <option value="نقادة">نقادة</option>
        </select>
      </div>
      <div class="col-md-3">
        <select id="statusFilter" class="form-select">
          <option value="">📊 كل الحالات</option>
          <option value="متاحة">✅ متاحة</option>
          <option value="قيد الدراسة">⏳ قيد الدراسة</option>
        </select>
      </div>
      <div class="col-md-3">
        <input type="text" id="searchInput" class="form-control" placeholder="🔎 ابحث بالاسم...">
      </div>
      <div class="col-6">
        <button onclick="filterMarkers()" class="btn btn-primary w-100">
          <i class="bi bi-search"></i> بدء البحث
        </button>
      </div>
      <div class="col-6">
        <button onclick="resetFilters()" class="btn btn-outline-secondary w-100">
          <i class="bi bi-arrow-counterclockwise"></i> إعادة تعيين
        </button>
      </div>
    </div>
  </div>

  <!-- Map Container -->
  <div class="map-container">
    <div id="map"></div>

    <!-- Enhanced Tools Panel -->
    <div class="measure-control">
      <div class="tools-title">🛠️ أدوات القياس</div>
      <button id="distanceBtn" onclick="toggleDistance()" class="btn btn-outline-primary btn-sm" title="قياس المسافات">
        <i class="bi bi-rulers"></i> قياس المسافة
      </button>
      <button id="areaBtn" onclick="toggleArea()" class="btn btn-outline-success btn-sm" title="قياس المساحة">
        <i class="bi bi-polygon"></i> قياس المساحة
      </button>
      <button id="clearBtn" onclick="clearAll()" class="btn btn-outline-danger btn-sm" title="مسح الكل">
        <i class="bi bi-trash"></i> مسح الكل
      </button>
    </div>

    <!-- Floating Action Button -->
    <div class="coordinate-input-button">
      <button id="pinBtn" onclick="openCoordinateModal()" class="btn" title="أضف نقطة بالإحداثيات">
        <i class="bi bi-pin-map-fill"></i>
      </button>
    </div>

    <!-- Distance & Area Display -->
    <div id="distanceDisplay" class="display-card" style="display: none;">
      📏 المسافة الكلية: 0 متر
    </div>
    <div id="areaDisplay" class="display-card" style="display: none;">
      📐 المساحة: 0 م²
    </div>
  </div>
</div>

<!-- Enhanced Coordinate Modal -->
<div id="coordinateModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title">📍 أدخل إحداثيات النقطة</h5>
      <button type="button" class="btn-close" onclick="closeCoordinateModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="mb-3">
        <label class="form-label">🌐 خط العرض (Latitude)</label>
        <input type="number" id="latInput" class="form-control" placeholder="مثال: 26.1558" step="any">
        <small class="form-text text-muted">قيمة بين -90 و 90</small>
      </div>
      <div class="mb-3">
        <label class="form-label">🌍 خط الطول (Longitude)</label>
        <input type="number" id="lngInput" class="form-control" placeholder="مثال: 32.7164" step="any">
        <small class="form-text text-muted">قيمة بين -180 و 180</small>
      </div>
      <div id="errorText" class="alert alert-danger" style="display: none;"></div>
      <div class="mt-3 d-flex justify-content-between">
        <button class="btn btn-outline-secondary" onclick="closeCoordinateModal()">إلغاء</button>
        <button class="btn btn-primary" onclick="addManualMarker()">✅ تأكيد</button>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet-geometryutil"></script>

<script>
  let markers = [];
  let map;
  
  // المتغيرات الجديدة
  let distancePoints = [];
  let areaPoints = [];
  let distanceLine = null;
  let areaPolygon = null;
  let manualMarker = null;

  // بيانات وهمية للفرص الاستثمارية (يمكن استبدالها بملف JSON)
  const opportunities = [
    {
      id: 1,
      name: "مشروع صناعي متطور",
      lat: 26.155,
      lng: 32.716,
      sector: "صناعي",
      region: "قنا",
      area: "1000 م²",
      status: "متاحة"
    },
    {
      id: 2,
      name: "مزرعة نموذجية حديثة",
      lat: 26.200,
      lng: 32.800,
      sector: "زراعي",
      region: "قفط",
      area: "5000 م²",
      status: "قيد الدراسة"
    },
    {
      id: 3,
      name: "مركز خدمات متكامل",
      lat: 26.100,
      lng: 32.650,
      sector: "خدماتي",
      region: "نجع حمادي",
      area: "800 م²",
      status: "متاحة"
    }
  ];

  // Hide loading overlay after page loads
  window.addEventListener('load', function() {
    setTimeout(function() {
      const loadingOverlay = document.getElementById('loadingOverlay');
      loadingOverlay.style.opacity = '0';
      setTimeout(function() {
        loadingOverlay.style.display = 'none';
      }, 500);
    }, 1000);
  });

  // Enhanced tooltip function
  function showTooltip(text) {
    const tooltip = document.createElement('div');
