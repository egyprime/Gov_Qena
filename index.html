<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>الفرص الاستثمارية - قنا</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500&display=swap" rel="stylesheet">

  <!-- Bootstrap RTL -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      margin: 0;
      background-color: #f8f9fa; 
    }

    header {
      background: #004d40;
      color: white;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    header h1 {
      font-size: 1.2rem;
      margin: 0;
      flex-grow: 1;
    }

    header img {
      height: 60px;
      width: 60px;
      object-fit: contain;
      border-radius: 0;
      background: white;
      padding: 4px;
      box-sizing: border-box;
    }

    #map {
      height: 90vh;
      width: 100%;
    }

    .measure-control {
      position: absolute;
      left: 10px;
      top: 80px;
      z-index: 1000;
      background: white;
      border-radius: 6px;
      padding: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      width: 120px;
    }

    .leaflet-popup-content-wrapper {
      max-width: 300px;
    }
  </style>
</head>
<body>

<!-- Header -->
<header class="text-white">
  <img src="https://i.ibb.co/fYrDg2P1/gov-logo.jpg"  alt="شعار المحافظة"
       onerror="this.src='https://via.placeholder.com/60x60?text=Gov+Logo'">
  <h1>الفرص الاستثمارية في محافظة قنا</h1>
  <img src="https://i.ibb.co/fd3Kgbsj/gis-logo.png" alt="شعار الموقع"
       onerror="this.src='https://via.placeholder.com/60x60?text=GIS+Logo'">
</header>

<!-- Filters -->
<div class="container mt-3">
  <div class="row g-2 mb-3">
    <div class="col-md-3">
      <select id="sectorFilter" class="form-select">
        <option value="">كل القطاعات</option>
        <option value="صناعي">صناعي</option>
        <option value="زراعي">زراعي</option>
        <option value="خدماتي">خدماتي</option>
      </select>
    </div>
    <div class="col-md-3">
      <select id="regionFilter" class="form-select">
        <option value="">كل المناطق</option>
        <option value="قفط">قفط</option>
        <option value="نجع حمادي">نجع حمادي</option>
        <option value="قنا">قنا</option>
      </select>
    </div>
    <div class="col-md-3">
      <select id="statusFilter" class="form-select">
        <option value="">كل الحالات</option>
        <option value="متاحة">متاحة</option>
        <option value="قيد الدراسة">قيد الدراسة</option>
      </select>
    </div>
    <div class="col-md-3">
      <input type="text" id="searchInput" class="form-control" placeholder="ابحث بالاسم...">
    </div>
    <div class="col-6">
      <button onclick="filterMarkers()" class="btn btn-primary w-100">
        <i class="bi bi-search"></i> بدء البحث
      </button>
    </div>
    <div class="col-6">
      <button onclick="resetFilters()" class="btn btn-outline-secondary w-100">
        <i class="bi bi-arrow-counterclockwise"></i> إعادة تعيين
      </button>
    </div>
  </div>
</div>

<!-- Measurement Button -->
<div class="measure-control">
  <button id="measureBtn" onclick="toggleMeasuring()" class="btn btn-outline-primary btn-sm w-100">
    <i class="bi bi-rulers"></i> بدء القياس
  </button>
</div>

<!-- Distance Display -->
<div id="distanceDisplay" style="position: absolute; left: 10px; top: 10px; z-index: 1000; background: white; padding: 10px; border-radius: 5px; display: none; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">
  المسافة الكلية: 0 متر
</div>

<!-- Map -->
<div id="map"></div>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  let markers = [];
  let measuring = false;
  let polyline = null;
  let totalDistance = 0;
  let map;

  // تحميل الفرص والاستدعاء الأولي للخريطة
  fetch('opportunities.json')
    .then(res => {
      if (!res.ok) throw new Error("فشل تحميل ملف الفرص");
      return res.json();
    })
    .then(data => {
      console.log("تم تحميل الفرص:", data); // تسجيل البيانات
      window.opportunities = data;
      initMap();
    })
    .catch(err => {
      console.error(err);
      alert("حدث خطأ في تحميل الفرص: " + err.message);
    });

  function initMap() {
    // إنشاء الخريطة
    map = L.map('map').setView([26.155, 32.716], 9); // موقع قنا

    // خريطة MapTiler Satellite
    L.tileLayer('https://api.maptiler.com/maps/satellite/{z}/{x}/{y}.jpg?key=73sDwzFoqKJbdF9udESc', {
      attribution: '&copy; <a href="https://www.maptiler.com/copyright/" target="_blank">MapTiler</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap contributors</a>',
      tileSize: 512,
      zoomOffset: -1,
      maxZoom: 20,
      minZoom: 0
    }).addTo(map);

    opportunities.forEach(opportunity => {
      const marker = L.marker([opportunity.lat, opportunity.lng]).addTo(map);
      marker.options.data = opportunity;
      marker.bindPopup(`
        <b>${opportunity.name}</b><br>
        القطاع: ${opportunity.sector}<br>
        المساحة: ${opportunity.area}<br>
        <button class="btn btn-primary btn-sm mt-2" onclick="saveToFavorites(${opportunity.id})">
          <i class="bi bi-heart"></i> المفضلة
        </button>
      `);
      markers.push(marker);
    });
  }

  // دالة قياس المسافات
  function toggleMeasuring() {
    measuring = !measuring;
    const measureBtn = document.getElementById('measureBtn');
    const distanceDisplay = document.getElementById('distanceDisplay');

    if (measuring) {
      measureBtn.innerHTML = '<i class="bi bi-stop-circle"></i> إنهاء القياس';
      polyline = L.polyline([], { color: 'red', weight: 3 }).addTo(map);
      distanceDisplay.style.display = 'block';
      map.on('click', addPoint);
    } else {
      measureBtn.innerHTML = '<i class="bi bi-rulers"></i> بدء القياس';
      map.off('click', addPoint);
      if (polyline) map.removeLayer(polyline);
      polyline = null;
      distanceDisplay.style.display = 'none';
      totalDistance = 0;
    }
  }

  function addPoint(e) {
    const latlngs = polyline.getLatLngs();
    latlngs.push(e.latlng);
    polyline.setLatLngs(latlngs);
    if (latlngs.length > 1) {
      const lastPoint = latlngs[latlngs.length - 2];
      const distance = map.distance(lastPoint, e.latlng);
      totalDistance += distance;
      document.getElementById('distanceDisplay').innerText =
        'المسافة الكلية: ' + totalDistance.toFixed(2) + ' متر';
    }
  }

  // الفلاتر
  function filterMarkers() {
    const sector = document.getElementById('sectorFilter').value;
    const region = document.getElementById('regionFilter').value;
    const status = document.getElementById('statusFilter').value;
    const search = document.getElementById('searchInput').value.toLowerCase();

    markers.forEach(marker => {
      const data = marker.options.data;
      let show = true;
      if (sector && data.sector !== sector) show = false;
      if (region && data.region !== region) show = false;
      if (status && data.status !== status) show = false;
      if (search && !data.name.toLowerCase().includes(search)) show = false;
      if (show) marker.addTo(map);
      else map.removeLayer(marker);
    });
  }

  function resetFilters() {
    document.getElementById('sectorFilter').value = '';
    document.getElementById('regionFilter').value = '';
    document.getElementById('statusFilter').value = '';
    document.getElementById('searchInput').value = '';
    filterMarkers();
  }

  function saveToFavorites(id) {
    let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
    if (!favorites.includes(id)) {
      favorites.push(id);
      localStorage.setItem('favorites', JSON.stringify(favorites));
      alert("تم الحفظ في المفضلة");
    } else {
      alert("الفرصة موجودة بالفعل في المفضلة");
    }
  }
</script>
</body>
</html>
