<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>الفرص الاستثمارية - قنا</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap RTL -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

  <style>
    :root {
      --primary-color: #004d40;
      --secondary-color: #00695c;
      --accent-color: #26a69a;
      --success-color: #4caf50;
      --warning-color: #ff9800;
      --danger-color: #f44336;
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --shadow-glow: 0 8px 32px rgba(0, 77, 64, 0.3);
      --gradient-primary: linear-gradient(135deg, #004d40 0%, #00695c 50%, #26a69a 100%);
      --gradient-accent: linear-gradient(45deg, #26a69a, #4db6ac, #80cbc4);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', 'Tajawal', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #0f4c75 0%, #3282b8 50%, #bbe1fa 100%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    /* Animated Background Particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(180deg); }
    }

    /* Enhanced Header */
    header {
      background: var(--gradient-primary);
      color: white;
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-glow);
      backdrop-filter: blur(20px);
      border-bottom: 2px solid var(--glass-border);
    }

    header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.1), transparent);
      animation: rotate 10s linear infinite;
      z-index: -1;
    }

    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }

    header h1 {
      font-size: 1.5rem;
      margin: 0;
      flex-grow: 1;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      animation: pulse 2s ease-in-out infinite alternate;
      font-weight: 700;
      background: linear-gradient(45deg, #fff, #e0f2f1, #fff);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header img {
      height: 70px;
      width: 70px;
      object-fit: contain;
      border-radius: 50%;
      background: var(--glass-bg);
      padding: 8px;
      box-sizing: border-box;
      border: 2px solid var(--glass-border);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      animation: bounce 2s ease-in-out infinite;
    }

    header img:hover {
      transform: scale(1.1) rotate(360deg);
      box-shadow: 0 0 20px rgba(255,255,255,0.5);
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-5px); }
    }

    /* Enhanced Map Container */
    #map {
      height: 90vh;
      width: 100%;
      border-radius: 0 0 20px 20px;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.3);
      position: relative;
    }

    /* Glassmorphism Filters */
    .filters-container {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      margin: 20px;
      box-shadow: var(--shadow-glow);
      animation: slideInDown 0.8s ease-out;
    }

    .form-select, .form-control {
      background: var(--glass-bg) !important;
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border) !important;
      border-radius: 15px !important;
      color: white !important;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .form-select:focus, .form-control:focus {
      box-shadow: 0 0 20px rgba(38, 166, 154, 0.5) !important;
      border-color: var(--accent-color) !important;
      transform: translateY(-2px);
    }

    .form-select option {
      background: var(--primary-color);
      color: white;
    }

    /* Enhanced Buttons */
    .btn {
      border-radius: 25px !important;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      border: none !important;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn-primary {
      background: var(--gradient-primary) !important;
      box-shadow: 0 4px 15px rgba(0, 77, 64, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 77, 64, 0.5);
    }

    .btn-outline-secondary {
      background: var(--glass-bg) !important;
      backdrop-filter: blur(10px);
      border: 2px solid var(--glass-border) !important;
      color: white !important;
    }

    .btn-outline-secondary:hover {
      background: var(--gradient-accent) !important;
      transform: translateY(-3px);
      color: white !important;
    }

    /* Enhanced Tools Panel */
    .measure-control {
      position: absolute;
      left: 10px;
      top: 100px;
      z-index: 1000;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 15px;
      box-shadow: var(--shadow-glow);
      width: 140px;
      border: 1px solid var(--glass-border);
      animation: slideInLeft 0.8s ease-out;
    }

    .tool-btn {
      background: var(--glass-bg) !important;
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border) !important;
      color: white !important;
      margin-bottom: 10px;
      border-radius: 15px !important;
      transition: all 0.3s ease;
      font-size: 0.9rem;
    }

    .tool-btn:hover {
      background: var(--gradient-accent) !important;
      transform: translateX(5px);
      box-shadow: 0 5px 15px rgba(38, 166, 154, 0.4);
    }

    .tool-btn.active {
      background: var(--gradient-primary) !important;
      animation: pulse 1s ease-in-out infinite alternate;
    }

    /* Floating Coordinate Button */
    .coordinate-input-button {
      position: absolute;
      left: 20px;
      bottom: 20px;
      z-index: 1000;
      animation: pulse 2s ease-in-out infinite;
    }

    .coordinate-input-button .btn {
      width: 60px;
      height: 60px;
      border-radius: 50% !important;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: var(--gradient-primary) !important;
      box-shadow: var(--shadow-glow);
      transition: all 0.3s ease;
    }

    .coordinate-input-button .btn:hover {
      transform: scale(1.1) rotate(360deg);
      box-shadow: 0 0 30px rgba(38, 166, 154, 0.6);
    }

    /* Enhanced Display Panels */
    .display-panel {
      position: absolute;
      left: 20px;
      z-index: 1000;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      padding: 15px 20px;
      border-radius: 15px;
      border: 1px solid var(--glass-border);
      color: white;
      font-weight: 600;
      box-shadow: var(--shadow-glow);
      min-width: 200px;
      text-align: center;
      animation: fadeInLeft 0.5s ease-out;
    }

    #distanceDisplay {
      top: 20px;
      background: linear-gradient(135deg, #f44336, #e91e63);
    }

    #areaDisplay {
      top: 80px;
      background: linear-gradient(135deg, #4caf50, #8bc34a);
    }

    /* Enhanced Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
      animation: fadeIn 0.3s ease-out;
    }

    .modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--glass-bg);
      backdrop-filter: blur(30px);
      margin: auto;
      padding: 0;
      border: 1px solid var(--glass-border);
      border-radius: 25px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      animation: slideInUp 0.4s ease-out;
      overflow: hidden;
    }

    .modal-header {
      background: var(--gradient-primary);
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--glass-border);
    }

    .modal-body {
      padding: 25px;
      color: white;
    }

    .modal-body .form-label {
      color: #e0f2f1;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .btn-close {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    .btn-close:hover {
      background: rgba(255,255,255,0.2);
      transform: rotate(90deg);
    }

    /* Tooltip Enhancements */
    .custom-tooltip {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1001;
      background: var(--gradient-accent);
      color: white;
      padding: 15px 20px;
      border-radius: 15px;
      box-shadow: var(--shadow-glow);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      animation: slideInRight 0.5s ease-out;
      font-weight: 600;
      max-width: 300px;
    }

    /* Popup Enhancements */
    .leaflet-popup-content-wrapper {
      background: var(--glass-bg) !important;
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 15px !important;
      box-shadow: var(--shadow-glow);
      color: white;
    }

    .leaflet-popup-content {
      color: white !important;
      font-weight: 500;
    }

    .leaflet-popup-tip {
      background: var(--glass-bg) !important;
      border: 1px solid var(--glass-border);
    }

    /* Statistics Panel */
    .stats-panel {
      position: absolute;
      right: 20px;
      top: 100px;
      z-index: 1000;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-glow);
      color: white;
      min-width: 200px;
      animation: slideInRight 0.8s ease-out;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .stat-item:last-child {
      border-bottom: none;
    }

    .stat-value {
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--accent-color);
    }

    /* Loading Animation */
    .loading-spinner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3000;
      display: none;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255,255,255,0.1);
      border-left: 4px solid var(--accent-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Map Layer Controls */
    .layer-control {
      position: absolute;
      right: 20px;
      top: 20px;
      z-index: 1000;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border-radius: 15px;
      padding: 15px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-glow);
      color: white;
      min-width: 150px;
    }

    .layer-btn {
      background: var(--glass-bg) !important;
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border) !important;
      color: white !important;
      margin-bottom: 8px;
      border-radius: 10px !important;
      font-size: 0.85rem;
      padding: 8px 12px;
      transition: all 0.3s ease;
    }

    .layer-btn:hover {
      background: var(--gradient-accent) !important;
      transform: translateX(-3px);
    }

    .layer-btn.active {
      background: var(--gradient-primary) !important;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .measure-control, .stats-panel, .layer-control {
        position: relative;
        width: 100%;
        margin: 10px;
        animation: none;
      }
      
      .coordinate-input-button {
        bottom: 80px;
      }
      
      header h1 {
        font-size: 1.2rem;
      }
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideInDown {
      from { transform: translateY(-100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes slideInLeft {
      from { transform: translateX(-100px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes slideInRight {
      from { transform: translateX(100px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes slideInUp {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeInLeft {
      from { transform: translateX(-50px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: var(--glass-bg);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--gradient-primary);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--gradient-accent);
    }
  </style>
</head>
<body>

<!-- Animated Background Particles -->
<div class="particles" id="particles"></div>

<!-- Loading Spinner -->
<div class="loading-spinner" id="loadingSpinner">
  <div class="spinner"></div>
</div>

<!-- Enhanced Header -->
<header class="text-white">
  <img src="https://i.ibb.co/fYrDg2P1/gov-logo.jpg" alt="شعار المحافظة"
       onerror="this.src='https://via.placeholder.com/70x70/004d40/ffffff?text=GOV'">
  <h1 class="animate__animated animate__fadeInDown">🏛️ الفرص الاستثمارية في محافظة قنا ⭐</h1>
  <img src="https://i.ibb.co/fd3Kgbsj/gis-logo.png" alt="شعار الموقع"
       onerror="this.src='https://via.placeholder.com/70x70/26a69a/ffffff?text=GIS'">
</header>

<!-- Enhanced Filters -->
<div class="filters-container animate__animated animate__fadeInUp">
  <div class="row g-3 mb-3">
    <div class="col-md-3">
      <label class="form-label text-white mb-2">🏭 القطاع</label>
      <select id="sectorFilter" class="form-select">
        <option value="">كل القطاعات</option>
        <option value="صناعي">🏭 صناعي</option>
        <option value="زراعي">🌾 زراعي</option>
        <option value="خدماتي">🏪 خدماتي</option>
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label text-white mb-2">📍 المنطقة</label>
      <select id="regionFilter" class="form-select">
        <option value="">كل المناطق</option>
        <option value="دشنا">🏘️ دشنا</option>
        <option value="الوقف">🏘️ الوقف</option>
        <option value="نجع حمادي">🏘️ نجع حمادي</option>
        <option value="فرشوط">🏘️ فرشوط</option>
        <option value="أبوتشت">🏘️ أبوتشت</option>
        <option value="قنا">🏘️ قنا</option>
        <option value="قفط">🏘️ قفط</option>
        <option value="قوص">🏘️ قوص</option>
        <option value="نقادة">🏘️ نقادة</option>
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label text-white mb-2">📊 الحالة</label>
      <select id="statusFilter" class="form-select">
        <option value="">كل الحالات</option>
        <option value="متاحة">✅ متاحة</option>
        <option value="قيد الدراسة">⏳ قيد الدراسة</option>
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label text-white mb-2">🔍 البحث</label>
      <input type="text" id="searchInput" class="form-control" placeholder="ابحث بالاسم...">
    </div>
  </div>
  <div class="row g-2">
    <div class="col-6">
      <button onclick="filterMarkers()" class="btn btn-primary w-100">
        <i class="bi bi-search"></i> 🔍 بدء البحث
      </button>
    </div>
    <div class="col-6">
      <button onclick="resetFilters()" class="btn btn-outline-secondary w-100">
        <i class="bi bi-arrow-counterclockwise"></i> 🔄 إعادة تعيين
      </button>
    </div>
  </div>
</div>

<!-- Enhanced Tools Panel -->
<div class="measure-control">
  <h6 class="text-white text-center mb-3">🛠️ أدوات القياس</h6>
  <button id="distanceBtn" onclick="toggleDistance()" class="btn tool-btn w-100 mb-2" title="قياس المسافات">
    <i class="bi bi-rulers"></i> 📏 المسافة
  </button>
  <button id="areaBtn" onclick="toggleArea()" class="btn tool-btn w-100 mb-2" title="قياس المساحة">
    <i class="bi bi-polygon"></i> 📐 المساحة
  </button>
  <button id="clearBtn" onclick="clearAll()" class="btn tool-btn w-100" title="مسح الكل">
    <i class="bi bi-trash"></i> 🗑️ مسح الكل
  </button>
</div>

<!-- Layer Control Panel -->
<div class="layer-control">
  <h6 class="text-white text-center mb-3">🗺️ طبقات الخريطة</h6>
  <button id="satelliteBtn" onclick="changeTo('satellite')" class="btn layer-btn w-100 active">
    🛰️ فضائية
  </button>
  <button id="streetBtn" onclick="changeTo('street')" class="btn layer-btn w-100">
    🛣️ شوارع
  </button>
  <button id="hybridBtn" onclick="changeTo('hybrid')" class="btn layer-btn w-100">
    🗺️ مختلطة
  </button>
</div>

<!-- Statistics Panel -->
<div class="stats-panel">
  <h6 class="text-center mb-3">📊 إحصائيات الفرص</h6>
  <div class="stat-item">
    <span>🏭 صناعية:</span>
    <span class="stat-value" id="industrialCount">0</span>
  </div>
  <div class="stat-item">
    <span>🌾 زراعية:</span>
    <span class="stat-value" id="agricultureCount">0</span>
  </div>
  <div class="stat-item">
    <span>🏪 خدماتية:</span>
    <span class="stat-value" id="serviceCount">0</span>
  </div>
  <div class="stat-item">
    <span>✅ متاحة:</span>
    <span class="stat-value" id="availableCount">0</span>
  </div>
</div>

<!-- Enhanced Coordinate Button -->
<div class="coordinate-input-button">
  <button id="pinBtn" onclick="openCoordinateModal()" class="btn" title="أضف نقطة بالإحداثيات">
    <i class="bi bi-pin-map-fill"></i>
  </button>
</div>

<!-- Enhanced Display Panels -->
<div id="distanceDisplay" class="display-panel" style="display: none;">
  📏 المسافة الكلية: 0 متر
</div>
<div id="areaDisplay" class="display-panel" style="display: none;">
  📐 المساحة: 0 م²
</div>

<!-- Enhanced Modal -->
<div id="coordinateModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title">📍 أدخل إحداثيات النقطة</h5>
      <button type="button" class="btn-close" onclick="closeCoordinateModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="mb-3">
        <label class="form-label">🌐 خط العرض (Latitude)</label>
        <input type="number" id="latInput" class="form-control" placeholder="مثال: 26.1558" step="any">
        <small class="form-text text-muted">قيمة بين -90 و 90</small>
      </div>
      <div class="mb-3">
        <label class="form-label">🌐 خط الطول (Longitude)</label>
        <input type="number" id="lngInput" class="form-control" placeholder="مثال: 32.7164" step="any">
