<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض المضلعات</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        .polygon-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
        }
        .polygon-card {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
        }
        .polygon-svg {
            width: 200px;
            height: 200px;
            margin: 10px auto;
        }
        .polygon-info {
            margin-top: 15px;
            text-align: right;
        }
        .polygon-info h3 {
            color: #444;
            margin-bottom: 5px;
        }
        .polygon-info p {
            color: #666;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <h1>عرض المضلعات الهندسية</h1>
    
    <div class="polygon-container" id="polygons-container">
        <!-- سيتم ملء هذا القسم بواسطة JavaScript -->
    </div>

    <script>
        // جلب بيانات المضلعات من ملف JSON
        fetch('polygons.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('polygons-container');
                
                data.polygons.forEach(polygon => {
                    // إنشاء بطاقة لكل مضلع
                    const card = document.createElement('div');
                    card.className = 'polygon-card';
                    
                    // إنشاء SVG لعرض المضلع
                    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svg.setAttribute('class', 'polygon-svg');
                    svg.setAttribute('viewBox', '0 0 300 300');
                    
                    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    poly.setAttribute('points', polygon.points);
                    poly.setAttribute('fill', polygon.color);
                    poly.setAttribute('stroke', '#333');
                    poly.setAttribute('stroke-width', '2');
                    
                    svg.appendChild(poly);
                    
                    // إنشاء معلومات المضلع
                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'polygon-info';
                    
                    const name = document.createElement('h3');
                    name.textContent = polygon.name;
                    
                    const type = document.createElement('p');
                    type.textContent = `النوع: ${polygon.type}`;
                    
                    const sides = document.createElement('p');
                    sides.textContent = `عدد الأضلاع: ${polygon.sides}`;
                    
                    infoDiv.appendChild(name);
                    infoDiv.appendChild(type);
                    infoDiv.appendChild(sides);
                    
                    // إضافة العناصر إلى البطاقة
                    card.appendChild(svg);
                    card.appendChild(infoDiv);
                    
                    // إضافة البطاقة إلى الحاوية
                    container.appendChild(card);
                });
            })
            .catch(error => {
                console.error('حدث خطأ أثناء جلب البيانات:', error);
                document.getElementById('polygons-container').innerHTML = 
                    '<p>حدث خطأ أثناء تحميل المضلعات. يرجى المحاولة لاحقاً.</p>';
            });
    </script>
</body>
</html>
