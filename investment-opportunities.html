  <style>
    :root {
      --primary: #004d40;
      --primary-light: #39796b;
      --secondary: #ffab00;
      --accent: #e64a19;
      --light: #f8f9fa;
      --dark: #263238;
      --sidebar-width: 280px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Tajawal', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #f8f9fa 0%, #e0f2f1 100%);
      color: var(--dark);
      min-height: 100vh;
      background-attachment: fixed;
      padding-right: var(--sidebar-width);
      transition: padding-right 0.3s ease;
    }
    header {
      background: linear-gradient(135deg, var(--primary) 0%, #00251a 100%);
      color: white;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      position: relative;
      z-index: 100;
    }
    header h1 {
      font-size: 1.5rem;
      margin: 0;
      flex-grow: 1;
    }
    header img {
      height: 70px;
      width: 70px;
      object-fit: contain;
      border-radius: 50%;
      background: white;
      padding: 4px;
    }
    #map {
      height: 90vh;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      margin: 1rem auto;
    }
    .measure-control {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 30px;
      padding: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      width: 50px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(0, 0, 0, 0.1);
    }
    .measure-control button {
      width: 45px;
      height: 45px;
      border-radius: 50% !important;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      border: none !important;
    }
    #distanceBtn {
      background: linear-gradient(135deg, #1976d2, #64b5f6);
      color: white;
    }
    #areaBtn {
      background: linear-gradient(135deg, #388e3c, #81c784);
      color: white;
    }
    #clearBtn {
      background: linear-gradient(135deg, #d32f2f, #f44336);
      color: white;
    }
    #distanceDisplay, #areaDisplay {
      position: absolute;
      left: 15px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 18px;
      border-radius: 30px;
      display: none;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
      font-weight: bold;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(0, 0, 0, 0.1);
    }
    #distanceDisplay {
      top: 15px;
      background: linear-gradient(135deg, #1976d2, #64b5f6);
      color: white;
    }
    #areaDisplay {
      top: 65px;
      background: linear-gradient(135deg, #388e3c, #81c784);
      color: white;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background: linear-gradient(145deg, #f8f9fa, #e0f2f1);
      margin: auto;
      padding: 0;
      border: none;
      border-radius: 20px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
    .modal-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    }
    .modal-body {
      padding: 25px;
    }
    .btn-close {
      background: none;
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }
    .leaflet-popup-content-wrapper {
      border-radius: 15px !important;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2) !important;
    }
    .leaflet-popup-content {
      margin: 15px !important;
    }
    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--sidebar-width);
      height: 100%;
      background: linear-gradient(135deg, var(--primary) 0%, #00251a 100%);
      color: white;
      z-index: 1000;
      box-shadow: -5px 0 20px rgba(0, 0, 0, 0.3);
      transform: translateX(0);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      overflow-y: auto;
      padding-top: 70px;
    }
    .sidebar-hidden {
      transform: translateX(100%);
    }
    .sidebar-header {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--sidebar-width);
      height: 70px;
      background: linear-gradient(135deg, var(--primary) 0%, #001510 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      z-index: 1010;
    }
    .sidebar-title {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toggle-btn {
      background: transparent;
      border: none;
      color: white;
      font-size: 1.8rem;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sidebar-menu {
      list-style: none;
      padding: 20px 0;
    }
    .sidebar-item {
      margin: 5px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      padding: 15px 25px;
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .sidebar-link i {
      font-size: 1.3rem;
      margin-left: 15px;
      min-width: 24px;
      text-align: center;
    }
    .sidebar-link.active {
      background: rgba(255, 255, 255, 0.15);
      padding-right: 30px;
      font-weight: 700;
    }
    .sidebar-footer {
      padding: 20px;
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 20px;
    }
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      display: none;
      backdrop-filter: blur(3px);
    }
    @media (max-width: 992px) {
      body {
        padding-right: 0;
      }
      .sidebar {
        transform: translateX(100%);
      }
      .sidebar-visible {
        transform: translateX(0);
      }
    }
    .menu-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 900;
      width: 50px;
      height: 50px;
      border-radius: 50%;

      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: all 0.3s ease;

      overflow-y: auto;
      padding-right: 10px;
    }

      align-items: center;
      justify-content: space-between;
      padding: 12px 15px;
      margin-bottom: 10px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
      border-left: 4px solid var(--accent);
      transition: all 0.3s ease;
    }
    .favorite-info {
      flex-grow: 1;
    }
    .favorite-name {
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 5px;
    }
    .favorite-actions {
      display: flex;
      gap: 8px;
    }
    .favorite-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      border: none;
      transition: all 0.3s ease;

      padding: 30px;
      color: #666;
    }

      margin-bottom: 15px;
      color: #e0e0e0;
    }

      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .favorites-count {
      background: var(--primary);
      color: white;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.9rem;
    }

</head>

</div>

  function initMap() {

      tileSize: 512,
      zoomOffset: -1,
      maxZoom: 20,
      minZoom: 0
    }).addTo(map);
    opportunities.forEach(opportunity => {
      const marker = L.marker([opportunity.lat, opportunity.lng]).addTo(map);
      marker.options.data = opportunity;
      const popupContent = `
        <div style="text-align: right; min-width: 250px;">
          <div style="background: linear-gradient(135deg, #004d40, #00796b); color: white; padding: 10px; border-radius: 10px 10px 0 0; margin: -15px -15px 10px -15px;">
            <h4 style="margin: 0; font-weight: bold;">${opportunity.name}</h4>
          </div>
          <div style="padding: 10px 0;">
            <p><i class="bi bi-geo-alt"></i> خط العرض: ${opportunity.lat.toFixed(6)}</p>
            <p><i class="bi bi-geo-alt"></i> خط الطول: ${opportunity.lng.toFixed(6)}</p>
          </div>
          <button class="btn btn-primary btn-sm w-100" onclick="saveToFavorites(${opportunity.id})" style="border-radius: 10px;">
            <i class="bi bi-heart"></i> حفظ في المفضلة
          </button>
        </div>
      `;
      marker.bindPopup(popupContent);
      markers.push(marker);
    });
    updateFavoritesCounter();

  function toggleDistance() {
    if (window.distanceMode) {
      window.distanceMode = false;
      map.off('click', addDistancePoint);
      document.getElementById('distanceBtn').innerHTML = '<i class="bi bi-rulers"></i>';
      document.getElementById('distanceDisplay').style.display = 'none';
    } else {
      window.distanceMode = true;
      document.getElementById('distanceBtn').innerHTML = '<i class="bi bi-stop-circle"></i>';
      distancePoints = [];
      distanceLine = L.polyline([], { color: '#1976d2', weight: 4, dashArray: '5, 10' }).addTo(map);
      map.on('click', addDistancePoint);
    }
  }
  function addDistancePoint(e) {
    const latlngs = distanceLine.getLatLngs();
    latlngs.push(e.latlng);
    distanceLine.setLatLngs(latlngs);
    L.circleMarker(e.latlng, { color: '#1976d2', fillColor: '#64b5f6', fillOpacity: 1, radius: 7 }).addTo(map);
    if (latlngs.length > 1) {
      let total = 0;
      for (let i = 1; i < latlngs.length; i++) {
        total += map.distance(latlngs[i - 1], latlngs[i]);
      }
      const display = document.getElementById('distanceDisplay');
      display.innerHTML = total >= 1000 ? `<i class="bi bi-rulers"></i> المسافة الكلية: ${(total / 1000).toFixed(2)} كم` : `<i class="bi bi-rulers"></i> المسافة الكلية: ${total.toFixed(0)} متر`;
      display.style.display = 'block';
    }
  }
  function toggleArea() {
    if (window.areaMode) {
      window.areaMode = false;
      map.off('click', addAreaPoint);
      document.getElementById('areaBtn').innerHTML = '<i class="bi bi-square"></i>';
      document.getElementById('areaDisplay').style.display = 'none';
    } else {
      window.areaMode = true;
      document.getElementById('areaBtn').innerHTML = '<i class="bi bi-stop-circle"></i>';
      areaPoints = [];
      map.on('click', addAreaPoint);
    }
  }
  function geodesicArea(latLngs) {
    let area = 0.0;
    const len = latLngs.length;
    let j = len - 1;
    if (len < 3) return 0;
    for (let i = 0; i < len; j = i, i++) {
      const p1 = latLngs[i];
      const p2 = latLngs[j];
      area += (p2.lng * Math.PI / 180 - p1.lng * Math.PI / 180) * 
              (2 + Math.sin(p1.lat * Math.PI / 180) + Math.sin(p2.lat * Math.PI / 180));
    }
    area = area * 6378137.0 * 6378137.0 / 2.0;
    return Math.abs(area);
  }
  function addAreaPoint(e) {
    areaPoints.push(e.latlng);
    L.circleMarker(e.latlng, { color: '#388e3c', fillColor: '#81c784', fillOpacity: 1, radius: 7 }).addTo(map);
    if (areaPoints.length >= 3) {
      if (areaPolygon) map.removeLayer(areaPolygon);
      areaPolygon = L.polygon(areaPoints, { color: '#388e3c', fillColor: '#81c784', fillOpacity: 0.3, weight: 3 }).addTo(map);
      const area = geodesicArea(areaPoints);
      const display = document.getElementById('areaDisplay');
      display.innerHTML = area >= 1e6 ? `<i class="bi bi-polygon"></i> المساحة: ${(area / 1e6).toFixed(2)} كم²` : `<i class="bi bi-polygon"></i> المساحة: ${Math.round(area)} م²`;
      display.style.display = 'block';
    }
  }
  function clearAll() {
    if (distanceLine) map.removeLayer(distanceLine);
    if (areaPolygon) map.removeLayer(areaPolygon);
    if (areaLabel) map.removeLayer(areaLabel);
    map.eachLayer(function(layer) {
      if (layer instanceof L.CircleMarker) {
        map.removeLayer(layer);
      }
    });
    distancePoints = [];
    areaPoints = [];
    distanceLine = null;
    areaPolygon = null;
    areaLabel = null;
    window.distanceMode = false;
    window.areaMode = false;
    document.getElementById('distanceBtn').innerHTML = '<i class="bi bi-rulers"></i>';
    document.getElementById('areaBtn').innerHTML = '<i class="bi bi-square"></i>';
    document.getElementById('distanceDisplay').style.display = 'none';
    document.getElementById('areaDisplay').style.display = 'none';
    map.off('click', addDistancePoint);
    map.off('click', addAreaPoint);
  }
  function saveToFavorites(id) {
    let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
    if (!favorites.includes(id)) {
      favorites.push(id);
      localStorage.setItem('favorites', JSON.stringify(favorites));
      updateFavoritesCounter();
    }
  }
  function removeFromFavorites(id) {
    let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
    favorites = favorites.filter(item => item !== id);
    localStorage.setItem('favorites', JSON.stringify(favorites));
    updateFavoritesCounter();
    renderFavoritesList();
  }
  function clearAllFavorites() {
    localStorage.removeItem('favorites');
    updateFavoritesCounter();
    renderFavoritesList();
  }
  function updateFavoritesCounter() {
    const favorites = JSON.parse(localStorage.getItem('favorites')) || [];
    document.getElementById('favoritesCounter').textContent = favorites.length;
    const countElement = document.getElementById('favoritesCount');
    if (countElement) {
      countElement.textContent = `${favorites.length} عنصر${favorites.length === 1 ? '' : 'اً'}`;
    }
  }
  function renderFavoritesList() {
    const favorites = JSON.parse(localStorage.getItem('favorites')) || [];
    const container = document.getElementById('favoritesList');
    container.innerHTML = '';
    if (favorites.length === 0) {
      container.innerHTML = `
        <div class="no-favorites">
          <i class="bi bi-heart"></i>
          <h4>لا توجد فرص في المفضلة</h4>
          <p>اضغط على زر "حفظ في المفضلة" في أي فرصة لإضافتها هنا</p>
        </div>
      `;
      return;
    }
    favorites.forEach(id => {
      const opportunity = opportunities.find(op => op.id === id);
      if (opportunity) {
        const item = document.createElement('div');
        item.className = 'favorite-item';
        item.innerHTML = `
          <div class="favorite-info">
            <div class="favorite-name">${opportunity.name}</div>
          </div>
          <div class="favorite-actions">
            <button class="favorite-btn" onclick="showFavoriteOnMap(${opportunity.id})" title="عرض على الخريطة">
              <i class="bi bi-eye"></i>
            </button>
            <button class="favorite-btn" onclick="removeFromFavorites(${opportunity.id})" title="حذف من المفضلة">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        `;
        container.appendChild(item);
      }
    });
  }
  function showFavoriteOnMap(id) {
    const opportunity = opportunities.find(op => op.id === id);
    if (opportunity) {
      closeFavoritesModal();
      map.setView([opportunity.lat, opportunity.lng], 14);
      const marker = markers.find(m => m.options.data.id === id);
      if (marker) {
        setTimeout(() => {
          marker.openPopup();
        }, 500);
      }
    }
  }
  function openFavoritesModal() {
    renderFavoritesList();
    document.getElementById('favoritesModal').classList.add('show');
  }
  function closeFavoritesModal() {
    document.getElementById('favoritesModal').classList.remove('show');
  }
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    if (sidebar.classList.contains('sidebar-visible')) {
      sidebar.classList.remove('sidebar-visible');
      overlay.style.display = 'none';
    } else {
      sidebar.classList.add('sidebar-visible');
      overlay.style.display = 'block';
    }
  }
  function handleMenuLinks(event) {
    const linkType = this.getAttribute('data-link');
    if (linkType === 'favorites') {
      event.preventDefault();
      openFavoritesModal();
    }
    if (window.innerWidth <= 992) {
      toggleSidebar();
    }
  }
  document.addEventListener('DOMContentLoaded', function() {
    initMap();
    document.getElementById('menuToggle').addEventListener('click', toggleSidebar);
    document.getElementById('closeSidebar').addEventListener('click', toggleSidebar);
    document.getElementById('sidebarOverlay').addEventListener('click', toggleSidebar);
    const menuLinks = document.querySelectorAll('.sidebar-link');
    menuLinks.forEach(link => {
      link.addEventListener('click', handleMenuLinks);
    });
  });
</script>
</body>
</html>
