    :root {

      --light: #f8f9fa;
      --dark: #263238;
      --sidebar-width: 280px;

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Tajawal', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #f8f9fa 0%, #e0f2f1 100%);
      color: var(--dark);
      min-height: 100vh;
      background-attachment: fixed;
      padding-right: var(--sidebar-width);
      transition: padding-right 0.3s ease;
    }
    header {
      background: linear-gradient(135deg, var(--primary) 0%, #00251a 100%);
      color: white;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      position: relative;
      z-index: 100;
    }
    header h1 {
      font-size: 1.5rem;
      margin: 0;
      flex-grow: 1;
    }
    header img {
      height: 70px;
      width: 70px;
      object-fit: contain;
      border-radius: 50%;
      background: white;
      padding: 4px;
    }
    #map {
      height: 90vh;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      margin: 1rem auto;
    }
    .measure-control {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 30px;
      padding: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      width: 50px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(0, 0, 0, 0.1);
    }
    .measure-control button {
      width: 45px;
      height: 45px;
      border-radius: 50% !important;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      border: none !important;
    }
    #distanceBtn {
      background: linear-gradient(135deg, #1976d2, #64b5f6);
      color: white;
    }
    #areaBtn {
      background: linear-gradient(135deg, #388e3c, #81c784);
      color: white;
    }
    #clearBtn {
      background: linear-gradient(135deg, #d32f2f, #f44336);
      color: white;
    }
    #polygonsBtn {
      background: linear-gradient(135deg, #7b1fa2, #9c27b0);
      color: white;
    }
    #distanceDisplay, #areaDisplay {
      position: absolute;
      left: 15px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 18px;
      border-radius: 30px;
      display: none;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
      font-weight: bold;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(0, 0, 0, 0.1);
    }
    #distanceDisplay {
      top: 15px;
      background: linear-gradient(135deg, #1976d2, #64b5f6);
      color: white;
    }
    #areaDisplay {
      top: 65px;
      background: linear-gradient(135deg, #388e3c, #81c784);
      color: white;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background: linear-gradient(145deg, #f8f9fa, #e0f2f1);
      margin: auto;
      padding: 0;
      border: none;
      border-radius: 20px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
    .modal-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    }
    .modal-body {
      padding: 25px;
    }
    .form-control {
      border-radius: 12px !important;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.8);
    }

      background: none;
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }

      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 20px;
      margin: 20px auto;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(0, 0, 0, 0.05);
      display: none;

    .filters-container.show {
      display: block;
    }
    .filter-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      font-weight: 600;
      transition: all 0.3s ease;
      border: none;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    .reset-btn {
      background: linear-gradient(135deg, #616161, #9e9e9e);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);

      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2) !important;

      margin: 15px !important;
    }

      position: fixed;
      top: 0;
      right: 0;
      width: var(--sidebar-width);

      overflow-y: auto;
      padding-top: 70px;

      transform: translateX(100%);
    }

      position: fixed;
      top: 0;
      right: 0;
      width: var(--sidebar-width);

</head>

  function initMap() {
    map = L.map('map').setView([26.155, 32.716], 9);
    L.tileLayer('https://api.maptiler.com/maps/satellite/{z}/{x}/{y}.jpg?key=73sDwzFoqKJbdF9udESc', {
      attribution: '&copy; <a href="https://www.maptiler.com/copyright/" target="_blank">MapTiler</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap contributors</a>',
      tileSize: 512,
      zoomOffset: -1,
      maxZoom: 20,
      minZoom: 0
    }).addTo(map);
    opportunities.forEach(opportunity => {
      let iconColor = opportunity.sector === "صناعي" ? 'red' : opportunity.sector === "زراعي" ? 'green' : 'blue';
      const customIcon = L.divIcon({
        className: 'custom-div-icon',
        html: `<div style="background-color: ${iconColor}; width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); position: relative;">
                <div style="position: absolute; left: 30%; top: 30%; transform: rotate(45deg); color: white; font-size: 12px; font-weight: bold;">${opportunity.sector.charAt(0)}</div>
              </div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 30]
      });
      const marker = L.marker([opportunity.lat, opportunity.lng], {icon: customIcon}).addTo(map);
      marker.options.data = opportunity;
      const popupContent = `
        <div style="text-align: right; min-width: 250px;">
          <div style="background: linear-gradient(135deg, #004d40, #00796b); color: white; padding: 10px; border-radius: 10px 10px 0 0; margin: -15px -15px 10px -15px;">
            <h4 style="margin: 0; font-weight: bold;">${opportunity.name}</h4>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0;">
            <span style="background: #e3f2fd; padding: 5px 10px; border-radius: 20px; font-size: 0.9rem;">
              <i class="bi bi-building"></i> ${opportunity.sector}
            </span>
            <span style="background: #e8f5e9; padding: 5px 10px; border-radius: 20px; font-size: 0.9rem;">
              <i class="bi bi-geo-alt"></i> ${opportunity.region}
            </span>
            <span style="background: #fff3e0; padding: 5px 10px; border-radius: 20px; font-size: 0.9rem;">
              <i class="bi bi-arrows-fullscreen"></i> ${opportunity.area}
            </span>
            <span style="background: ${opportunity.status === 'متاحة' ? '#e8f5e9' : '#ffebee'}; padding: 5px 10px; border-radius: 20px; font-size: 0.9rem;">
              <i class="bi ${opportunity.status === 'متاحة' ? 'bi-check-circle' : 'bi-clock'}"></i> ${opportunity.status}
            </span>
          </div>
        </div>
      `;
      marker.bindPopup(popupContent);
      markers.push(marker);
    });
    L.geoJSON(geoData, {
      pointToLayer: function (feature, latlng) {
        return L.marker(latlng);
      },
      onEachFeature: function (feature, layer) {
        if (feature.properties && feature.properties.Name) {
          const coords = feature.geometry.coordinates;
          layer.bindPopup(`<div style="text-align: right;"><b>${feature.properties.Name}</b><br>إحداثيات: ${coords[1].toFixed(6)}, ${coords[0].toFixed(6)}</div>`);
        }
      }
    }).addTo(map);
  }
  function toggleDistance() {
    if (window.distanceMode) {
      window.distanceMode = false;
      map.off('click', addDistancePoint);
      document.getElementById('distanceBtn').innerHTML = '<i class="bi bi-rulers"></i>';
      document.getElementById('distanceDisplay').style.display = 'none';
    } else {
      window.distanceMode = true;
      document.getElementById('distanceBtn').innerHTML = '<i class="bi bi-stop-circle"></i>';
      distancePoints = [];
      distanceLine = L.polyline([], { color: '#1976d2', weight: 4, dashArray: '5, 10' }).addTo(map);
      map.on('click', addDistancePoint);
    }
  }
  function addDistancePoint(e) {
    const latlngs = distanceLine.getLatLngs();
    latlngs.push(e.latlng);
    distanceLine.setLatLngs(latlngs);
    L.circleMarker(e.latlng, { color: '#1976d2', fillColor: '#64b5f6', fillOpacity: 1, radius: 7 }).addTo(map);
    if (latlngs.length > 1) {
      let total = 0;
      for (let i = 1; i < latlngs.length; i++) {
        total += map.distance(latlngs[i - 1], latlngs[i]);
      }
      const display = document.getElementById('distanceDisplay');
      display.innerHTML = total >= 1000 ? `<i class="bi bi-rulers"></i> المسافة الكلية: ${(total / 1000).toFixed(2)} كم` : `<i class="bi bi-rulers"></i> المسافة الكلية: ${total.toFixed(0)} متر`;
      display.style.display = 'block';
    }
  }
  function toggleArea() {
    if (window.areaMode) {
      window.areaMode = false;
      map.off('click', addAreaPoint);
      document.getElementById('areaBtn').innerHTML = '<i class="bi bi-square"></i>';
      document.getElementById('areaDisplay').style.display = 'none';
    } else {
      window.areaMode = true;
      document.getElementById('areaBtn').innerHTML = '<i class="bi bi-stop-circle"></i>';
      areaPoints = [];
      map.on('click', addAreaPoint);
    }
  }
  function geodesicArea(latLngs) {
    let area = 0.0;
    const len = latLngs.length;
    let j = len - 1;
    if (len < 3) return 0;
    for (let i = 0; i < len; j = i, i++) {
      const p1 = latLngs[i];
      const p2 = latLngs[j];
      area += (p2.lng * Math.PI / 180 - p1.lng * Math.PI / 180) * 
              (2 + Math.sin(p1.lat * Math.PI / 180) + Math.sin(p2.lat * Math.PI / 180));
    }
    area = area * 6378137.0 * 6378137.0 / 2.0;
    return Math.abs(area);
  }
  function addAreaPoint(e) {
    areaPoints.push(e.latlng);
    L.circleMarker(e.latlng, { color: '#388e3c', fillColor: '#81c784', fillOpacity: 1, radius: 7 }).addTo(map);
    if (areaPoints.length >= 3) {
      if (areaPolygon) map.removeLayer(areaPolygon);
      areaPolygon = L.polygon(areaPoints, { color: '#388e3c', fillColor: '#81c784', fillOpacity: 0.3, weight: 3 }).addTo(map);
      const area = geodesicArea(areaPoints);
      const display = document.getElementById('areaDisplay');
      display.innerHTML = area >= 1e6 ? `<i class="bi bi-polygon"></i> المساحة: ${(area / 1e6).toFixed(2)} كم²` : `<i class="bi bi-polygon"></i> المساحة: ${Math.round(area)} م²`;
      display.style.display = 'block';
    }
  }
  function clearAll() {
    if (distanceLine) map.removeLayer(distanceLine);
    if (areaPolygon) map.removeLayer(areaPolygon);
    if (areaLabel) map.removeLayer(areaLabel);
    map.eachLayer(function(layer) {
      if (layer instanceof L.CircleMarker) {
        map.removeLayer(layer);
      }
    });
    distancePoints = [];
    areaPoints = [];
    distanceLine = null;
    areaPolygon = null;
    areaLabel = null;
    window.distanceMode = false;
    window.areaMode = false;
    document.getElementById('distanceBtn').innerHTML = '<i class="bi bi-rulers"></i>';
    document.getElementById('areaBtn').innerHTML = '<i class="bi bi-square"></i>';
    document.getElementById('distanceDisplay').style.display = 'none';
    document.getElementById('areaDisplay').style.display = 'none';
    map.off('click', addDistancePoint);
    map.off('click', addAreaPoint);
  }
  function togglePolygons() {
    polygonsVisible = !polygonsVisible;
    if (polygonsLayer) {
      if (polygonsVisible) {
        polygonsLayer.addTo(map);
      } else {
        map.removeLayer(polygonsLayer);
      }
    }
  }
  function filterMarkers() {
    const sector = document.getElementById('sectorFilter').value;
    const region = document.getElementById('regionFilter').value;
    const status = document.getElementById('statusFilter').value;
    const search = document.getElementById('searchInput').value.toLowerCase();
    markers.forEach(marker => {
      const data = marker.options.data;
      let show = true;
      if (sector && data.sector !== sector) show = false;
      if (region && data.region !== region) show = false;
      if (status && data.status !== status) show = false;
      if (search && !data.name.toLowerCase().includes(search)) show = false;
      if (show) {
        marker.addTo(map);
      } else {
        map.removeLayer(marker);
      }
    });
  }
  function resetFilters() {
    document.getElementById('sectorFilter').value = '';
    document.getElementById('regionFilter').value = '';
    document.getElementById('statusFilter').value = '';
    document.getElementById('searchInput').value = '';
    filterMarkers();
  }
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    if (sidebar.classList.contains('sidebar-visible')) {
      sidebar.classList.remove('sidebar-visible');
      overlay.style.display = 'none';
    } else {
      sidebar.classList.add('sidebar-visible');
      overlay.style.display = 'block';
    }
  }
  document.addEventListener('DOMContentLoaded', function() {
    initMap();
    document.getElementById('menuToggle').addEventListener('click', toggleSidebar);
    document.getElementById('closeSidebar').addEventListener('click', toggleSidebar);
    document.getElementById('sidebarOverlay').addEventListener('click', toggleSidebar);
    document.getElementById('toggleFilters').addEventListener('click', function() {
      const container = document.getElementById('filtersContainer');
      container.classList.toggle('show');
    });
  });
</script>
