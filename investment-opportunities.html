<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة المناطق السكنية في قنا، مصر</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        #map-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #map {
            flex: 1;
            height: 70vh;
        }
        #header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }
        #sidebar {
            background-color: white;
            padding: 15px;
            overflow-y: auto;
            height: 30vh;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
        }
        .house-info {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
            cursor: pointer;
        }
        .house-info:hover {
            background-color: #f9f9f9;
        }
        .house-info h3 {
            margin: 0 0 5px 0;
            color: #2c3e50;
        }
        .house-info p {
            margin: 0;
            color: #7f8c8d;
        }
        .highlighted {
            background-color: #e3f2fd;
        }
    </style>
</head>
<body>
    <div id="map-container">
        <div id="header">
            <h1>خريطة المناطق السكنية في محافظة قنا، مصر</h1>
        </div>
        <div id="map"></div>
        <div id="sidebar">
            <h2 style="text-align: center; margin-top: 0;">قائمة المناطق السكنية</h2>
            <div id="houses-list"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // إنشاء الخريطة
        const map = L.map('map').setView([26.1550, 32.7165], 14);

        // إضافة طبقة الخريطة الأساسية
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // جلب بيانات المناطق السكنية من ملف JSON
        fetch('qena_houses.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('حدث خطأ في جلب البيانات');
                }
                return response.json();
            })
            .then(data => {
                const housesList = document.getElementById('houses-list');
                const polygons = [];

                data.features.forEach(feature => {
                    // إنشاء مضلع على الخريطة
                    const polygon = L.polygon(
                        feature.geometry.coordinates[0].map(coord => [coord[1], coord[0]]),
                        {
                            color: feature.properties.color,
                            fillOpacity: 0.5,
                            weight: 2
                        }
                    ).addTo(map);

                    // إضافة معلومات النافذة المنبثقة
                    polygon.bindPopup(`
                        <h3>${feature.properties.name}</h3>
                        <p>${feature.properties.description}</p>
                        <p>ID: ${feature.properties.id}</p>
                    `);

                    // إنشاء عنصر في القائمة الجانبية
                    const houseElement = document.createElement('div');
                    houseElement.className = 'house-info';
                    houseElement.innerHTML = `
                        <h3>${feature.properties.name}</h3>
                        <p>${feature.properties.description}</p>
                    `;

                    // إضافة تفاعل عند النقر
                    houseElement.addEventListener('click', () => {
                        // إزالة التمييز من جميع العناصر
                        document.querySelectorAll('.house-info').forEach(el => {
                            el.classList.remove('highlighted');
                        });
                        
                        // تمييز العنصر المحدد
                        houseElement.classList.add('highlighted');
                        
                        // تكبير وتحديد المضلع على الخريطة
                        map.fitBounds(polygon.getBounds());
                        polygon.setStyle({ weight: 5 });
                        
                        // إعادة النمط بعد ثانية
                        setTimeout(() => {
                            polygon.setStyle({ weight: 2 });
                        }, 1000);
                    });

                    housesList.appendChild(houseElement);
                    polygons.push(polygon);
                });

                // ضبط عرض الخريطة ليشمل جميع المضلعات
                if (polygons.length > 0) {
                    const group = new L.featureGroup(polygons);
                    map.fitBounds(group.getBounds());
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('houses-list').innerHTML = `
                    <p style="color: red;">حدث خطأ في تحميل البيانات. يرجى التأكد من وجود ملف qena_houses.json</p>
                    <p>${error.message}</p>
                `;
            });
    </script>
</body>
</html>
