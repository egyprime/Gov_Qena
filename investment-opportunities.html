<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>الفرص الاستثمارية - قنا</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --primary: #004d40;
      --primary-light: #39796b;
      --secondary: #ffab00;
      --accent: #e64a19;
      --light: #f8f9fa;
      --dark: #263238;
      --sidebar-width: 280px;
      --blue-gradient: linear-gradient(135deg, #1a2a6c, #2c5282, #3182ce);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Tajawal', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #e6f7ff 0%, #f0f9ff 100%);
      color: var(--dark);
      min-height: 100vh;
      background-attachment: fixed;
      padding-right: var(--sidebar-width);
      transition: padding-right 0.3s ease;
    }
    header {
      background: var(--blue-gradient);
      color: white;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      position: relative;
      z-index: 100;
    }
    header h1 {
      font-size: 1.5rem;
      margin: 0;
      flex-grow: 1;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }
    header img {
      height: 70px;
      width: 70px;
      object-fit: contain;
      border-radius: 50%;
      background: white;
      padding: 4px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
    }
    #map {
      height: 90vh;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      margin: 1rem auto;
      transition: all 0.4s ease;
    }
    .measure-control {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 30px;
      padding: 10px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
      width: 50px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(0, 0, 0, 0.1);
    }
    .measure-control button {
      width: 45px;
      height: 45px;
      border-radius: 50% !important;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      border: none !important;
    }
    #distanceBtn {
      background: linear-gradient(135deg, #1976d2, #64b5f6);
      color: white;
    }
    #clearBtn {
      background: linear-gradient(135deg, #d32f2f, #f44336);
      color: white;
    }
    #coordinateBtn {
      background: linear-gradient(135deg, #9c27b0, #e91e63);
      color: white;
    }
    #distanceDisplay {
      position: absolute;
      left: 15px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 18px;
      border-radius: 30px;
      display: none;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
      font-weight: bold;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(0, 0, 0, 0.1);
    }
    #distanceDisplay {
      top: 15px;
      background: linear-gradient(135deg, #1976d2, #64b5f6);
      color: white;
    }
    .coordinate-display {
      position: absolute;
      left: 15px;
      bottom: 15px;
      z-index: 1000;
      background: linear-gradient(135deg, #9c27b0, #e91e63);
      color: white;
      padding: 12px 18px;
      border-radius: 30px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
      font-weight: bold;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(0, 0, 0, 0.1);
      display: none;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background: linear-gradient(145deg, #f8f9fa, #e0f2f1);
      margin: auto;
      padding: 0;
      border: none;
      border-radius: 20px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
    .modal-header {
      background: var(--blue-gradient);
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    }
    .modal-body {
      padding: 25px;
    }
    .btn-close {
      background: none;
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }
    /* تحسينات البوب أب */
    .leaflet-popup-content-wrapper {
      border-radius: 15px !important;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2) !important;
      background: linear-gradient(135deg, #f8f9fa, #e0f2f1);
      animation: popupFadeIn 0.4s ease-out;
    }
    .leaflet-popup-content {
      margin: 15px !important;
      text-align: right;
      min-width: 250px;
    }
    .popup-header {
      background: var(--blue-gradient);
      color: white;
      padding: 12px 15px;
      border-radius: 10px 10px 0 0;
      margin: -15px -15px 10px -15px;
      position: relative;
      overflow: hidden;
    }
    .popup-header::before {
      content: '';
      position: absolute;
      top: -10px;
      right: -10px;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
    }
    .popup-header h4 {
      margin: 0;
      font-weight: bold;
      font-size: 1.2rem;
    }
    .popup-body {
      padding: 10px 0;
    }
    .popup-info {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      padding: 8px 10px;
      background: rgba(26, 42, 108, 0.05);
      border-radius: 8px;
      transition: all 0.3s ease;
    }
    .popup-info:hover {
      background: rgba(26, 42, 108, 0.1);
      transform: translateX(-5px);
    }
    .popup-info i {
      margin-left: 10px;
      font-size: 1.2rem;
      color: #1a2a6c;
    }
    .popup-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      padding-top: 10px;
      border-top: 1px solid rgba(0, 0, 0, 0.1);
    }
    .popup-btn {
      padding: 8px 15px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .popup-btn-favorite {
      background: linear-gradient(135deg, #e91e63, #9c27b0);
      color: white;
    }
    .popup-btn-favorite:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(233, 30, 99, 0.3);
    }
    .popup-btn-zoom {
      background: linear-gradient(135deg, #1976d2, #64b5f6);
      color: white;
    }
    .popup-btn-zoom:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(25, 118, 210, 0.3);
    }
    @keyframes popupFadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--sidebar-width);
      height: 100%;
      background: var(--blue-gradient);
      color: white;
      z-index: 1000;
      box-shadow: -5px 0 20px rgba(0, 0, 0, 0.3);
      transform: translateX(0);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      overflow-y: auto;
      padding-top: 70px;
    }
    .sidebar-hidden {
      transform: translateX(100%);
    }
    .sidebar-header {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--sidebar-width);
      height: 70px;
      background: linear-gradient(135deg, #1a2a6c, #2c5282);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      z-index: 1010;
    }
    .sidebar-title {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toggle-btn {
      background: transparent;
      border: none;
      color: white;
      font-size: 1.8rem;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sidebar-menu {
      list-style: none;
      padding: 20px 0;
    }
    .sidebar-item {
      margin: 5px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      padding: 15px 25px;
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .sidebar-link i {
      font-size: 1.3rem;
      margin-left: 15px;
      min-width: 24px;
      text-align: center;
    }
    .sidebar-link.active {
      background: rgba(255, 255, 255, 0.15);
      padding-right: 30px;
      font-weight: 700;
    }
    .sidebar-footer {
      padding: 20px;
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 20px;
    }
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      display: none;
      backdrop-filter: blur(3px);
    }
    @media (max-width: 992px) {
      body {
        padding-right: 0;
      }
      .sidebar {
        transform: translateX(100%);
      }
      .sidebar-visible {
        transform: translateX(0);
      }
    }
    .menu-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 900;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--blue-gradient);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .favorite-list {
      max-height: 60vh;
      overflow-y: auto;
      padding-right: 10px;
    }
    .favorite-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 15px;
      margin-bottom: 10px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
      border-left: 4px solid var(--accent);
      transition: all 0.3s ease;
    }
    .favorite-info {
      flex-grow: 1;
    }
    .favorite-name {
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 5px;
    }
    .favorite-actions {
      display: flex;
      gap: 8px;
    }
    .favorite-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      border: none;
      transition: all 0.3s ease;
    }
    .no-favorites {
      text-align: center;
      padding: 30px;
      color: #666;
    }
    .no-favorites i {
      font-size: 3rem;
      margin-bottom: 15px;
      color: #e0e0e0;
    }
    .favorites-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .favorites-count {
      background: var(--primary);
      color: white;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.9rem;
    }
    .opportunity-list {
      max-height: 60vh;
      overflow-y: auto;
      padding-right: 10px;
    }
    .opportunity-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 15px;
      margin-bottom: 10px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
      border-left: 4px solid var(--secondary);
      transition: all 0.3s ease;
    }
    .opportunity-name {
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 5px;
    }
    .opportunity-area {
      color: #666;
      font-size: 0.9rem;
    }
    .opportunity-actions {
      display: flex;
      gap: 8px;
    }
    .opportunity-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      border: none;
      transition: all 0.3s ease;
    }
    .no-opportunities {
      text-align: center;
      padding: 30px;
      color: #666;
    }
    .opportunities-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .opportunities-count {
      background: var(--primary);
      color: white;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.9rem;
    }
    
    /* تحسين التسميات */
    .polygon-label {
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 15px;
      border-radius: 25px;
      border: 2px solid #e53935;
      font-weight: bold;
      text-align: center;
      font-size: 14px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      max-width: 250px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: none; /* سيتم إظهارها عند التقريب */
    }
    
    /* قائمة تحكم الخريطة الجديدة */
    .map-controls {
      position: absolute;
      bottom: 15px; /* التعديل هنا: نقل إلى أسفل الشاشة */
      right: 15px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(0, 0, 0, 0.1);
      min-width: 220px;
      transition: transform 0.3s ease, opacity 0.3s ease;
      transform: translateY(0);
      opacity: 1;
    }
    
    .map-controls.hidden {
      transform: translateY(100px);
      opacity: 0;
      pointer-events: none;
    }
    
    .map-controls h3 {
      font-size: 1.2rem;
      margin-bottom: 10px;
      color: #1a2a6c;
      border-bottom: 2px solid #3182ce;
      padding-bottom: 8px;
      text-align: center;
    }
    
    .map-control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .layer-btn {
      padding: 10px 15px;
      border-radius: 8px;
      background: #f5f5f5;
      border: 1px solid #e0e0e0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
      font-weight: 500;
      color: #333;
      text-align: right;
    }
    
    .layer-btn:hover {
      background: #e3f2fd;
      transform: translateX(-5px);
    }
    
    .layer-btn.active {
      background: #bbdefb;
      border-color: #90caf9;
      font-weight: 700;
    }
    
    .control-group-title {
      font-weight: 600;
      color: #2c5282;
      margin-top: 10px;
      margin-bottom: 5px;
      font-size: 1rem;
    }
    
    .map-controls button i {
      font-size: 1.2rem;
    }
    
    /* تحسين التصميم العام */
    .fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .floating {
      animation: float 6s ease-in-out infinite;
    }
    
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    
    .pulse {
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(26, 42, 108, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(26, 42, 108, 0); }
      100% { box-shadow: 0 0 0 0 rgba(26, 42, 108, 0); }
    }
    
    /* تسميات القياس */
    .distance-label {
      background: rgba(25, 118, 210, 0.8);
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
      pointer-events: none;
      transform: translateY(-50%);
    }
    
    /* تحسينات للشاشات الصغيرة */
    @media (max-width: 768px) {
      .map-controls {
        bottom: 80px; /* تعديل للموقع في الشاشات الصغيرة */
        right: 10px;
        left: 10px;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        min-width: auto;
        padding: 10px;
      }
      
      .map-control-group {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
      }
      
      .layer-btn {
        padding: 8px 12px;
        font-size: 14px;
      }
      
      .measure-control {
        left: 10px;
        top: auto;
        bottom: 20px;
        flex-direction: row;
        width: auto;
        padding: 8px;
      }
      
      #distanceDisplay {
        left: auto;
        right: 10px;
        top: 100px;
      }
      
      .coordinate-display {
        left: auto;
        right: 10px;
        bottom: 70px;
      }
    }
    
    /* زر إخفاء/إظهار قائمة التحكم */
    .toggle-controls-btn {
      position: absolute;
      bottom: 15px;
      right: 15px;
      z-index: 1001;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .toggle-controls-btn:hover {
      transform: scale(1.1);
      background: #e3f2fd;
    }
  </style>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-title">
      <i class="bi bi-list"></i> القائمة الرئيسية
    </div>
    <button class="toggle-btn" id="closeSidebar">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>
  <ul class="sidebar-menu">
    <li class="sidebar-item">
      <a href="index.html" class="sidebar-link">
        <i class="bi bi-house-door"></i> الصفحة الرئيسية
      </a>
    <!-- الفرص الاستثمارية الجديدة -->
    <li class="sidebar-item">
      <a href="#" class="sidebar-link" data-link="opportunities">
        <i class="bi bi-briefcase"></i> الفرص الاستثمارية
      </a>
    </li>
  </ul>
  <div class="sidebar-footer">
    © 2025 محافظة قنا<br>
    جميع الحقوق محفوظة
  </div>
</div>
<div class="menu-toggle" id="menuToggle">
  <i class="bi bi-list"></i>
</div>
<header class="text-white">
  <img src="https://i.ibb.co/fYrDg2P1/gov-logo.jpg" alt="شعار المحافظة">
  <h1>الفرص الاستثمارية في محافظة قنا</h1>
  <img src="https://i.ibb.co/fd3Kgbsj/gis-logo.png" alt="شعار الموقع">
</header>

<!-- زر إخفاء/إظهار قائمة التحكم -->
<div class="toggle-controls-btn" id="toggleControlsBtn">
  <i class="bi bi-chevron-up"></i>
</div>

<!-- قائمة تحكم الخريطة الجديدة -->
<div class="map-controls fade-in" id="mapControls">
  <h3>👆 تحكم في الخريطة</h3>
  
  <div class="control-group-title">طبقات الخريطة:</div>
  <div class="map-control-group">
    <button id="satelliteBtn" class="layer-btn active">
      <i class="bi bi-satellite"></i> 🛰️ صور الأقمار الصناعية
    </button>
    <button id="streetsBtn" class="layer-btn">
      <i class="bi bi-map"></i> 🗺️ الخريطة الطبوغرافية
    </button>
    <button id="hybridBtn" class="layer-btn">

  // الفرص الاستثمارية
  const investmentOpportunities = [
    { name: "مدينة ترفيهية", area: "16304 متر" },
    { name: "اقامة مول تجاري أو مجمع طبي", area: "3500 متر" },
    { name: "اقامة فندق سياحي ملحق به مول تجاري", area: "8099.8 متر" },
    { name: "اقامة فندق سياحي ملحق به مول تجاري", area: "7012 متر" },
    { name: "اقامة مدارس خاصة", area: "4134.5 متر" },
    { name: "اقامة فندق سياحي", area: "1200 متر" },
    { name: "اقامة مول تجاري", area: "2188 متر" }
  ];

  function initMap() {
    // إنشاء الخريطة
    map = L.map('map').setView([26.155, 32.716], 9);
    
    // إنشاء طبقات خرائط Google
    const googleSat = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: 'Google Satellite'
    });
    
    const googleTerrain = L.tileLayer('https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: 'Google Terrain'
    });
    
    const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: 'Google Hybrid'
    });
    
    // إضافة الطبقة الافتراضية
    googleSat.addTo(map);
    currentLayer = googleSat;
    
    // إضافة المربعات من بيانات JSON
    polygonsData.features.forEach(feature => {
      // تحويل الإحداثيات إلى تنسيق Leaflet [lat, lng]
      const coordinates = feature.geometry.coordinates[0].map(coord => [coord[1], coord[0]]);
      
      // إنشاء المضلع (فارغ مع إطار أحمر)
      const polygon = L.polygon(coordinates, {
        color: '#e53935',
        fillColor: 'transparent',
        fillOpacity: 0,
        weight: 3,
        dashArray: '5, 5'
      }).addTo(map);
      
      // إضافة تسمية داخل المضلع
      const centroid = getPolygonCentroid(coordinates);
      const label = L.marker(centroid, {
        icon: L.divIcon({
          className: 'polygon-label',
          html: feature.properties.الأسم,
          iconSize: [null, null],
          iconAnchor: [0, 0]
        })
      }).addTo(map);
      
      // تخزين التسمية كخاصية للمضلع
      polygon.label = label;
      
      // ربط المعلومات مع المضلع (باستخدام البوب أب الجديد)
      polygon.bindPopup(createPopupContent(feature.properties));
      
      // تخزين المضلع للإشارة إليه لاحقًا
      polygon.feature = feature;
      polygons.push(polygon);
    });
    
    // إنشاء قائمة الفرص الاستثمارية
    renderOpportunitiesList();
    
    // إضافة التحكم في الطبقات
    document.getElementById('satelliteBtn').addEventListener('click', function() {
      map.removeLayer(currentLayer);
      googleSat.addTo(map);
      currentLayer = googleSat;
      updateActiveButton(this);
    });
    
    document.getElementById('streetsBtn').addEventListener('click', function() {
      map.removeLayer(currentLayer);
      googleTerrain.addTo(map);
      currentLayer = googleTerrain;
      updateActiveButton(this);
    });
    
    document.getElementById('hybridBtn').addEventListener('click', function() {
      map.removeLayer(currentLayer);
      googleHybrid.addTo(map);
      currentLayer = googleHybrid;
      updateActiveButton(this);
    });
    
    // إضافة شعار الخريطة
    const mapLogo = L.control({position: 'bottomleft'});
    mapLogo.onAdd = function() {
      const div = L.DomUtil.create('div', 'map-logo');
      div.innerHTML = '🌍 خريطة الفرص الاستثمارية';
      div.style.backgroundColor = 'rgba(0, 0, 0, 0.6)';
      div.style.color = 'white';
      div.style.padding = '5px 10px';
      div.style.borderRadius = '5px';
      div.style.fontSize = '14px';
      return div;
    };
    mapLogo.addTo(map);
    
    // إضافة وظائف القياس
    document.getElementById('distanceBtn').addEventListener('click', toggleDistance);
    document.getElementById('coordinateBtn').addEventListener('click', toggleCoordinate);
    document.getElementById('clearBtn').addEventListener('click', clearAll);
    
    // تحديث التسميات عند تغيير مستوى التقريب
    map.on('zoomend', updateLabelsVisibility);
    updateLabelsVisibility(); // تحديث التسميات عند التحميل الأولي
    
    // تهيئة زر إخفاء/إظهار قائمة التحكم
    document.getElementById('toggleControlsBtn').addEventListener('click', toggleMapControls);
  }
  
  // إنشاء محتوى البوب أب الجديد
  function createPopupContent(properties) {
    return `
      <div class="popup-header">
        <h4>${properties.الأسم}</h4>
      </div>
      <div class="popup-body">
        <div class="popup-info">
          <i class="bi bi-rulers"></i>
          <span>${properties.المساحة}</span>
        </div>
        <div class="popup-actions">
          <button class="popup-btn popup-btn-favorite" onclick="addToFavorites('${properties.الأسم}', '${properties.المساحة}')">
            <i class="bi bi-heart"></i> إضافة للمفضلة
          </button>
          <button class="popup-btn popup-btn-zoom" onclick="zoomToPolygon('${properties.الأسم}')">
            <i class="bi bi-zoom-in"></i> تكبير
          </button>
        </div>
      </div>
    `;
  }
  
  // التكبير إلى مضلع محدد
  function zoomToPolygon(name) {
    const polygon = polygons.find(p => p.feature.properties.الأسم === name);
    if (polygon) {
      map.fitBounds(polygon.getBounds());
      polygon.openPopup();
    }
  }
  
  // تحديث الأزرار النشطة
  function updateActiveButton(activeButton) {
    // إزالة الفعالية من جميع الأزرار في نفس المجموعة
    const buttons = activeButton.parentElement.parentElement.querySelectorAll('.layer-btn');
    buttons.forEach(btn => btn.classList.remove('active'));
    
    // إضافة الفعالية للزر المضغوط
    activeButton.classList.add('active');
    
    // إزالة التركيز بعد النقر
    setTimeout(() => activeButton.blur(), 300);
  }
  
  // حساب مركز المضلع
  function getPolygonCentroid(coords) {
    let x = 0, y = 0;
    for (let i = 0; i < coords.length; i++) {
      x += coords[i][0];
      y += coords[i][1];
    }
    return [x / coords.length, y / coords.length];
  }
  
  // إنشاء قائمة الفرص الاستثمارية
  function renderOpportunitiesList() {
    const container = document.getElementById('opportunitiesList');
    container.innerHTML = '';
    
    investmentOpportunities.forEach((opportunity, index) => {
      const item = document.createElement('div');
      item.className = 'opportunity-item fade-in';
      item.innerHTML = `
        <div class="favorite-info">
          <div class="opportunity-name">${opportunity.name}</div>
          <div class="opportunity-area">${opportunity.area}</div>
        </div>
        <div class="opportunity-actions">
          <button class="opportunity-btn" onclick="zoomToOpportunity(${index})" title="عرض على الخريطة">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      `;
      container.appendChild(item);
    });
  }
  
  // التكبير إلى فرصة محددة
  function zoomToOpportunity(index) {
    const opportunity = investmentOpportunities[index];
    if (!opportunity) return;
    
    // البحث عن المضلع المناسب
    const polygon = polygons.find(p => p.feature.properties.الأسم === opportunity.name);
    
    if (polygon) {
      map.fitBounds(polygon.getBounds());
      polygon.openPopup();
    }
    
    closeOpportunitiesModal();
  }
  
  // فتح نافذة الفرص الاستثمارية
  function openOpportunitiesModal() {
    document.getElementById('opportunitiesModal').classList.add('show');
  }
  
  // إغلاق نافذة الفرص الاستثمارية
  function closeOpportunitiesModal() {
    document.getElementById('opportunitiesModal').classList.remove('show');
  }
  
  // وظائف قياس المسافة
  function toggleDistance() {
    if (window.distanceMode) {
      window.distanceMode = false;
      map.off('click', addDistancePoint);
      document.getElementById('distanceBtn').innerHTML = '<i class="bi bi-rulers"></i>';
      document.getElementById('distanceDisplay').style.display = 'none';
    } else {
      window.distanceMode = true;
      document.getElementById('distanceBtn').innerHTML = '<i class="bi bi-stop-circle"></i>';
      distancePoints = [];
      distanceLine = L.polyline([], { color: '#1976d2', weight: 4, dashArray: '5, 10' }).addTo(map);
      map.on('click', addDistancePoint);
      
      // إخفاء وضع الإحداثيات إذا كان نشطًا
      if (coordinateMode) toggleCoordinate();
    }
  }
  
  function addDistancePoint(e) {
    const latlngs = distanceLine.getLatLngs();
    latlngs.push(e.latlng);
    distanceLine.setLatLngs(latlngs);
    
    // إضافة علامة نقطة
    L.circleMarker(e.latlng, { color: '#1976d2', fillColor: '#64b5f6', fillOpacity: 1, radius: 7 }).addTo(map);
    
    // إضافة تسميات المسافات
    if (latlngs.length > 1) {
      let total = 0;
      
      // إزالة التسميات القديمة
      distanceLabels.forEach(label => map.removeLayer(label));
      distanceLabels = [];
      
      // إضافة تسميات لكل قطعة
      for (let i = 1; i < latlngs.length; i++) {
        const p1 = latlngs[i - 1];
        const p2 = latlngs[i];
        const dist = map.distance(p1, p2);
        total += dist;
        
        // نقطة المنتصف
        const midLat = (p1.lat + p2.lat) / 2;
        const midLng = (p1.lng + p2.lng) / 2;
        const midPoint = L.latLng(midLat, midLng);
        
        // إنشاء التسمية
        const label = L.marker(midPoint, {
          icon: L.divIcon({
            className: 'distance-label',
            html: dist >= 1000 ? `${(dist / 1000).toFixed(2)} كم` : `${dist.toFixed(0)} م`,
            iconSize: [null, null]
          })
        }).addTo(map);
        
        distanceLabels.push(label);
      }
      
      // تحديث المسافة الإجمالية
      const display = document.getElementById('distanceDisplay');
      display.innerHTML = total >= 1000 ? `<i class="bi bi-rulers"></i> المسافة الكلية: ${(total / 1000).toFixed(2)} كم` : `<i class="bi bi-rulers"></i> المسافة الكلية: ${total.toFixed(0)} متر`;
      display.style.display = 'block';
    }
  }
  
  // وظيفة عرض الإحداثيات
  function toggleCoordinate() {
    coordinateMode = !coordinateMode;
    if (coordinateMode) {
      // تغيير حالة الزر
      document.getElementById('coordinateBtn').innerHTML = '<i class="bi bi-stop-circle"></i>';
      document.querySelector('.coordinate-display').style.display = 'block';
      
      // إضافة حدث النقر على الخريطة
      map.on('click', showCoordinate);
      
      // إخفاء أوضاع القياس الأخرى إذا كانت نشطة
      if (window.distanceMode) toggleDistance();
    } else {
      document.getElementById('coordinateBtn').innerHTML = '<i class="bi bi-geo-alt"></i>';
      document.querySelector('.coordinate-display').style.display = 'none';
      
      // إزالة حدث النقر على الخريطة
      map.off('click', showCoordinate);
      
      // إزالة العلامة إذا كانت موجودة
      if (coordinateMarker) {
        map.removeLayer(coordinateMarker);
        coordinateMarker = null;
      }
    }
  }
  
  function showCoordinate(e) {
    const { lat, lng } = e.latlng;
    
    // إزالة العلامة القديمة إذا كانت موجودة
    if (coordinateMarker) {
      map.removeLayer(coordinateMarker);
    }
    
    // إنشاء علامة جديدة
    coordinateMarker = L.marker(e.latlng, {
      icon: L.divIcon({
        className: 'coordinate-marker',
        html: `<div>${lat.toFixed(6)}, ${lng.toFixed(6)}</div>`,
        iconSize: [null, null]
      })
    }).addTo(map);
    
    // تحديث عرض الإحداثيات
    document.querySelector('.coordinate-display').innerHTML = `<i class="bi bi-geo-alt"></i> الإحداثيات: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
  }
  
  function clearAll() {
    // إزالة عناصر القياس
    if (distanceLine) map.removeLayer(distanceLine);
    
    // إزالة تسميات المسافات
    distanceLabels.forEach(label => map.removeLayer(label));
    distanceLabels = [];
    
    // إزالة العلامات الدائرية
    map.eachLayer(function(layer) {
      if (layer instanceof L.CircleMarker) {
        map.removeLayer(layer);
      }
    });
    
    // إعادة تعيين المتغيرات
    distancePoints = [];
    distanceLine = null;
    window.distanceMode = false;
    
    // إعادة تعيين الأزرار
    document.getElementById('distanceBtn').innerHTML = '<i class="bi bi-rulers"></i>';
    document.getElementById('distanceDisplay').style.display = 'none';
    
    // إزالة أحداث الخريطة
    map.off('click', addDistancePoint);
    
    // إزالة وضع الإحداثيات إذا كان نشطًا
    if (coordinateMode) {
      coordinateMode = false;
      document.getElementById('coordinateBtn').innerHTML = '<i class="bi bi-geo-alt"></i>';
      document.querySelector('.coordinate-display').style.display = 'none';
      map.off('click', showCoordinate);
      
      if (coordinateMarker) {
        map.removeLayer(coordinateMarker);
        coordinateMarker = null;
      }
    }
  }
  
  // تحديث رؤية تسميات المضلعات حسب مستوى التقريب
  function updateLabelsVisibility() {
    const zoom = map.getZoom();
    const minZoomForLabels = 14; // الحد الأدنى للتقريب لظهور التسميات
    
    polygons.forEach(polygon => {
      if (zoom >= minZoomForLabels) {
        if (!map.hasLayer(polygon.label)) {
          polygon.label.addTo(map);
        }
      } else {
        if (map.hasLayer(polygon.label)) {
          map.removeLayer(polygon.label);
        }
      }
    });
  }
  
  // وظائف القائمة الجانبية
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    if (sidebar.classList.contains('sidebar-visible')) {
      sidebar.classList.remove('sidebar-visible');
      overlay.style.display = 'none';
    } else {
      sidebar.classList.add('sidebar-visible');
      overlay.style.display = 'block';
    }
  }
  
  // إخفاء/إظهار قائمة التحكم في الخريطة
  function toggleMapControls() {
    const controls = document.getElementById('mapControls');
    const toggleBtn = document.getElementById('toggleControlsBtn');
    
    if (controls.classList.contains('hidden')) {
      controls.classList.remove('hidden');
      toggleBtn.innerHTML = '<i class="bi bi-chevron-up"></i>';
    } else {
      controls.classList.add('hidden');
      toggleBtn.innerHTML = '<i class="bi bi-chevron-down"></i>';
    }
  }
  
  function handleMenuLinks(event) {
    const linkType = this.getAttribute('data-link');
    if (linkType === 'favorites') {
      event.preventDefault();
      openFavoritesModal();
    }
    if (linkType === 'opportunities') {
      event.preventDefault();
      openOpportunitiesModal();
    }
    if (window.innerWidth <= 992) {
      toggleSidebar();
    }
  }
  
  // تهيئة الخريطة عند تحميل الصفحة
  document.addEventListener('DOMContentLoaded', function() {
    initMap();
    document.getElementById('menuToggle').addEventListener('click', toggleSidebar);
    document.getElementById('closeSidebar').addEventListener('click', toggleSidebar);
    document.getElementById('sidebarOverlay').addEventListener('click', toggleSidebar);
    const menuLinks = document.querySelectorAll('.sidebar-link');
    menuLinks.forEach(link => {
      link.addEventListener('click', handleMenuLinks);
    });
    
    // إضافة تأثيرات للعناصر
    document.querySelectorAll('.map-controls, .measure-control').forEach(el => {
      el.classList.add('fade-in');
    });
    
    document.querySelector('header').classList.add('pulse');
    
    // تهيئة عداد الفرص الاستثمارية
    document.getElementById('opportunitiesCount').textContent = `${investmentOpportunities.length} فرص`;
  });
</script>
</body>
</html>
