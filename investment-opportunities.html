<!DOCTYPE html>
<html>
<head>
    <title>خريطة البوليجونات</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>#map { height: 100vh; }</style>
</head>
<body>
    <div id="map"></div>
    
    <!-- 1. أضف مكتبة Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 2. أدرج ملف JSON مباشرة في الصفحة -->
    <script src="foras_estsmarea_67.json" type="application/json" id="geodata"></script>
    
    <!-- 3. الكود الرئيسي -->
    <script>
        const map = L.map('map').setView([26.8206, 30.8025], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        try {
            // احصل على البيانات من العنصر المضمن
            const geoData = JSON.parse(document.getElementById('geodata').textContent);
            console.log("البيانات المضمنة:", geoData);
            
            const geojsonLayer = L.geoJSON(geoData, {
                style: { color: '#ff7800', fillOpacity: 0.5 },
                onEachFeature: (feature, layer) => {
                    if (feature.properties) {
                        layer.bindPopup(`<b>${feature.properties.name || 'بدون اسم'}</b>`);
                    }
                }
            }).addTo(map);
            
            map.fitBounds(geojsonLayer.getBounds());
            
        } catch (e) {
            console.error("خطأ فادح:", e);
            alert(`فشل تحميل الخريطة: ${e.message}`);
        }
    </script>
</body>
</html>
