<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <title>خريطة - Investment Opportunities</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha512-some-integrity-hash"
    crossorigin=""
  />
  <style>
    #map { height: 80vh; width: 100%; }
  </style>
</head>
<body>

  <h1>خريطة الفرص الاستثمارية</h1>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha512-some-integrity-hash"
    crossorigin=""
  ></script>

  <script>
    // ====== إعداد الخريطة ======
    const MAPTILER_KEY = 'YOUR_MAPTILER_KEY_HERE'; // غيّر هذا بمفتاح MapTiler
    const map = L.map('map').setView([26.5, 32.7], 8); // غيّر الإحداثيات والزووم حسب موقعك

    // Tile layer من MapTiler (مثال سريع - استبدل tilesId/نام الـ map حسب حاجتك)
    L.tileLayer(`https://api.maptiler.com/maps/streets/tiles/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`, {
      tileSize: 512,
      zoomOffset: -1,
      attribution: '© MapTiler | © OpenStreetMap contributors'
    }).addTo(map);

    // ====== تحميل ملف GeoJSON وعرضه ======
    fetch('foras_estsmarea_67.json')
      .then(resp => {
        if (!resp.ok) throw new Error('HTTP error ' + resp.status);
        return resp.json();
      })
      .then(data => {
        // تأكّد: GeoJSON يجب أن يكون بصيغة WGS84 (coordinates: [lon, lat])
        const geojsonLayer = L.geoJSON(data, {
          style: feature => ({
            color: '#2b8cbe',      // حدود البوليجون
            weight: 1,             // سمك الحد
            fillOpacity: 0.4       // شفافية التعبئة
          }),
          onEachFeature: (feature, layer) => {
            // نافذة منبثقة تعرض خصائص الـ GeoJSON (إذا موجودة)
            const props = feature.properties || {};
            const popupHtml = Object.keys(props).length
              ? Object.entries(props).map(([k,v]) => `<strong>${k}</strong>: ${v}`).join('<br>')
              : '<em>لا توجد بيانات إضافية</em>';
            layer.bindPopup(popupHtml);

            // خيار: تغيير النمط عند المرور أو النقر
            layer.on({
              mouseover: e => e.target.setStyle({weight:2}),
              mouseout: e => geojsonLayer.resetStyle(e.target)
            });
          }
        }).addTo(map);

        // ضبط حدود الخريطة لتشمل جميع البوليجونات
        if (geojsonLayer.getBounds && !geojsonLayer.getBounds().isEmpty()) {
          map.fitBounds(geojsonLayer.getBounds(), {padding: [20,20]});
        }
      })
      .catch(err => {
        console.error('خطأ في تحميل أو تفسير ملف GeoJSON:', err);
        alert('فشل تحميل بيانات البوليجونات. افتح الكونسول للتحقق.');
      });
  </script>
</body>
</html>
