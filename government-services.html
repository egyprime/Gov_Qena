<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>العودة للصفحة الرئيسية</title>
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      padding: 20px;
      background-attachment: fixed;
    }
    
    .return-container {
      text-align: center;
      max-width: 600px;
      width: 100%;
      padding: 40px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: fadeIn 1s ease-out;
    }
    
    .return-icon {
      font-size: 5rem;
      margin-bottom: 30px;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      animation: pulse 2s infinite;
    }
    
    .page-title {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: white;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
    }
    
    .return-message {
      font-size: 1.2rem;
      margin-bottom: 40px;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.9);
    }
    
    .return-button {
      display: inline-block;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.1));
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 15px 50px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 1.2rem;
      text-decoration: none;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      margin: 20px 0;
      position: relative;
      overflow: hidden;
    }
    
    .return-button i {
      margin-left: 10px;
      transition: transform 0.3s ease;
    }
    
    .return-button:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.2));
      border-color: rgba(255, 255, 255, 0.6);
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
      color: white;
    }
    
    .return-button:hover i {
      transform: translateX(-5px);
    }
    
    .current-page {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.7);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    
    /* Developer signature */
    .developer-signature {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      color: white;
      padding: 12px 20px;
      border-radius: 25px;
      font-size: 0.85rem;
      z-index: 1000;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
      max-width: 280px;
    }
    
    .dev-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .dev-icon {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }
    
    @media (max-width: 768px) {
      .return-container {
        padding: 30px 20px;
      }
      
      .return-icon {
        font-size: 4rem;
      }
      
      .page-title {
        font-size: 2rem;
      }
      
      .return-button {
        padding: 12px 40px;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="return-container">
    <div class="return-icon">
      <i class="bi bi-house-door"></i>
    </div>
    
    <h1 class="page-title">قريبًا...</h1>
    
    <p class="return-message">
      هذه صفحة غير متاحة الان <span id="current-page-name">شكرا</span>.<br>
      يمكنك استخدام الزر أدناه للعودة إلى القائمة الرئيسية لمحافظة قنا.
    </p>
    
    <a href="index.html" class="return-button">
      <i class="bi bi-arrow-right"></i> العودة للرئيسية
    </a>
    
    <div class="current-page">
      الصفحة الحالية: <span id="page-name-display">غير متاح</span>
    </div>
  </div>
  
  <script>
    // تحديد اسم الصفحة الحالية من عنوان URL
    const pageNames = {
      'investment-opportunities.html': 'الفرص الاستثمارية',
      'government-services.html': 'الخدمات الحكومية',
      'public-facilities.html': 'المرافق العامة',
      'transportation.html': 'النقل والمواصلات',
      'tourism.html': 'السياحة والآثار',
      'reports.html': 'التقارير والإحصائيات'
    };
    
    // الحصول على اسم الملف الحالي
    const currentPage = window.location.pathname.split('/').pop();
    
    // عرض اسم الصفحة الحالية
    if (pageNames[currentPage]) {
      document.getElementById('current-page-name').textContent = pageNames[currentPage];
      document.getElementById('page-name-display').textContent = pageNames[currentPage];
    }
    
    // إضافة مؤثرات للزر عند التحميل
    document.querySelector('.return-button').addEventListener('mouseover', function() {
      this.style.transform = 'translateY(-5px)';
    });
    
    document.querySelector('.return-button').addEventListener('mouseout', function() {
      this.style.transform = 'translateY(0)';
    });
  </script>
</body>
</html>
