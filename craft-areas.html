<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>المناطق الحرفية بمحافظة قنا</title>
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      padding: 20px;
      background-attachment: fixed;
      overflow: hidden;
    }
    
    .image-frame {
      max-width: 95%;
      max-height: 85vh;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      border: 3px solid rgba(255, 255, 255, 0.4);
      position: relative;
      animation: fadeIn 1.5s ease-out, scaleUp 1.2s ease-out;
    }
    
    .target-image {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.8s ease;
    }
    
    .image-frame:hover .target-image {
      transform: scale(1.03);
    }
    
    .image-title {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(86, 70, 132, 0.95), transparent);
      padding: 30px 40px;
      text-align: center;
      animation: slideUp 1s ease-out;
    }
    
    .image-title h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
      color: #fff;
    }
    
    .image-title p {
      font-size: 1.4rem;
      opacity: 0.9;
      color: rgba(255, 255, 255, 0.95);
    }
    
    .watermark {
      position: absolute;
      top: 30px;
      left: 30px;
      font-size: 1.2rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 20px;
      border-radius: 30px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: fadeIn 2s ease-out;
    }
    
    .navigation {
      position: absolute;
      bottom: 30px;
      right: 30px;
      display: flex;
      gap: 15px;
    }
    
    .nav-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }
    
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes scaleUp {
      from { transform: scale(0.95); }
      to { transform: scale(1); }
    }
    
    @keyframes slideUp {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    @media (max-width: 768px) {
      .image-title {
        padding: 20px;
      }
      
      .image-title h1 {
        font-size: 2rem;
      }
      
      .image-title p {
        font-size: 1.1rem;
      }
      
      .watermark {
        top: 15px;
        left: 15px;
        font-size: 1rem;
        padding: 6px 15px;
      }
      
      .navigation {
        bottom: 20px;
        right: 20px;
      }
      
      .nav-btn {
        width: 45px;
        height: 45px;
        font-size: 1.3rem;
      }
    }
    
    @media (max-width: 480px) {
      .image-title h1 {
        font-size: 1.6rem;
      }
      
      .image-title p {
        font-size: 0.95rem;
      }
      
      .watermark {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="image-frame">
    <div class="watermark">
      المناطق الحرفية بمحافظة قنا
    </div>
    <img src="https://i.ibb.co/XkNXPLYb/image.jpg" alt="المناطق الحرفية بمحافظة قنا" class="target-image">
    <div class="image-title">
      <h1>المناطق الحرفية بمحافظة قنا</h1>
      <p>إرث حرفي عريق يمتد عبر الأجيال</p>
    </div>
    
    <div class="navigation">
      <div class="nav-btn">
        <i class="bi bi-zoom-in"></i>
      </div>
      <div class="nav-btn">
        <i class="bi bi-zoom-out"></i>
      </div>
      <div class="nav-btn">
        <i class="bi bi-arrow-clockwise"></i>
      </div>
    </div>
  </div>
  
  <script>
    // تكبير الصورة
    document.querySelector('.bi-zoom-in').closest('.nav-btn').addEventListener('click', function() {
      const img = document.querySelector('.target-image');
      const currentScale = parseFloat(img.style.transform.replace('scale(', '').replace(')', '')) || 1;
      img.style.transform = `scale(${currentScale + 0.1})`;
    });
    
    // تصغير الصورة
    document.querySelector('.bi-zoom-out').closest('.nav-btn').addEventListener('click', function() {
      const img = document.querySelector('.target-image');
      const currentScale = parseFloat(img.style.transform.replace('scale(', '').replace(')', '')) || 1;
      if (currentScale > 0.2) {
        img.style.transform = `scale(${currentScale - 0.1})`;
      }
    });
    
    // إعادة الصورة لحجمها الطبيعي
    document.querySelector('.bi-arrow-clockwise').closest('.nav-btn').addEventListener('click', function() {
      document.querySelector('.target-image').style.transform = 'scale(1)';
    });
  </script>
</body>
</html>
