<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>المناطق الحرفية بمحافظة قنا</title>
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      padding: 20px;
      background-attachment: fixed;
    }
    
    .image-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin: 20px 0;
    }
    
    .image-frame {
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      border: 3px solid rgba(255, 255, 255, 0.4);
      position: relative;
      animation: fadeIn 1.5s ease-out, scaleUp 1.2s ease-out;
    }
    
    .target-image {
      width: 100%;
      display: block;
      transition: transform 0.8s ease;
    }
    
    .image-info {
      background: linear-gradient(to top, rgba(86, 70, 132, 0.95), transparent);
      padding: 30px 40px;
      text-align: center;
      border-radius: 20px;
      width: 100%;
      animation: slideUp 1s ease-out;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .image-info h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
      color: #fff;
    }
    
    .image-info p {
      font-size: 1.4rem;
      opacity: 0.9;
      color: rgba(255, 255, 255, 0.95);
      margin-bottom: 20px;
    }
    
    .watermark {
      position: absolute;
      top: 30px;
      right: 30px;
      font-size: 1.2rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 20px;
      border-radius: 30px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: fadeIn 2s ease-out;
      z-index: 10;
    }
    
    .navigation {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
      width: 100%;
    }
    
    .nav-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }
    
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }
    
    /* زر الصفحة الرئيسية */
    .home-btn {
      position: absolute;
      top: 30px;
      left: 30px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      text-decoration: none;
      z-index: 10;
      animation: fadeIn 1.5s ease-out;
    }
    
    .home-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }
    
    .scroll-indicator {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
      font-size: 0.9rem;
      opacity: 0.8;
      z-index: 10;
      animation: bounce 2s infinite;
    }
    
    .scroll-indicator i {
      font-size: 1.5rem;
      margin-bottom: 5px;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes scaleUp {
      from { transform: scale(0.95); }
      to { transform: scale(1); }
    }
    
    @keyframes slideUp {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
      40% {transform: translateY(-15px);}
      60% {transform: translateY(-10px);}
    }
    
    @media (max-width: 768px) {
      .image-info {
        padding: 20px;
      }
      
      .image-info h1 {
        font-size: 2rem;
      }
      
      .image-info p {
        font-size: 1.1rem;
      }
      
      .watermark {
        top: 15px;
        right: 15px;
        font-size: 1rem;
        padding: 6px 15px;
      }
      
      .navigation {
        margin-top: 10px;
      }
      
      .nav-btn {
        width: 50px;
        height: 50px;
        font-size: 1.3rem;
      }
      
      .home-btn {
        top: 15px;
        left: 15px;
        width: 45px;
        height: 45px;
        font-size: 1.3rem;
      }
      
      .scroll-indicator {
        font-size: 0.8rem;
      }
    }
    
    @media (max-width: 480px) {
      .image-info h1 {
        font-size: 1.6rem;
      }
      
      .image-info p {
        font-size: 0.95rem;
      }
      
      .watermark {
        font-size: 0.85rem;
      }
      
      .home-btn {
        width: 40px;
        height: 40px;
        font-size: 1.1rem;
      }
      
      .nav-btn {
        width: 45px;
        height: 45px;
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="image-container">
    <div class="image-frame">
      <!-- زر الصفحة الرئيسية -->
      <a href="index.html" class="home-btn">
        <i class="bi bi-house-door"></i>
      </a>
      
      <div class="watermark">
        المناطق الحرفية بمحافظة قنا
      </div>
      
      <img src="https://i.ibb.co/XkNXPLYb/image.jpg" alt="المناطق الحرفية بمحافظة قنا" class="target-image">
      
      <div class="scroll-indicator">
        <i class="bi bi-chevron-double-down"></i>
        مرر للأسفل
      </div>
    </div>
    
    <div class="image-info">
      <h1>المناطق الحرفية بمحافظة قنا</h1>
      <p>إرث حرفي عريق يمتد عبر الأجيال</p>
      
      <div class="navigation">
        <div class="nav-btn" id="zoomIn">
          <i class="bi bi-zoom-in"></i>
        </div>
        <div class="nav-btn" id="zoomOut">
          <i class="bi bi-zoom-out"></i>
        </div>
        <div class="nav-btn" id="reset">
          <i class="bi bi-arrow-clockwise"></i>
        </div>
        <div class="nav-btn" id="fullScreen">
          <i class="bi bi-arrows-fullscreen"></i>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    // تكبير الصورة
    document.getElementById('zoomIn').addEventListener('click', function() {
      const img = document.querySelector('.target-image');
      const currentScale = parseFloat(img.style.transform.replace('scale(', '').replace(')', '')) || 1;
      img.style.transform = `scale(${currentScale + 0.1})`;
    });
    
    // تصغير الصورة
    document.getElementById('zoomOut').addEventListener('click', function() {
      const img = document.querySelector('.target-image');
      const currentScale = parseFloat(img.style.transform.replace('scale(', '').replace(')', '')) || 1;
      if (currentScale > 0.2) {
        img.style.transform = `scale(${currentScale - 0.1})`;
      }
    });
    
    // إعادة الصورة لحجمها الطبيعي
    document.getElementById('reset').addEventListener('click', function() {
      document.querySelector('.target-image').style.transform = 'scale(1)';
      document.body.scrollTop = 0; // للشاشات
      document.documentElement.scrollTop = 0; // للمتصفحات
    });
    
    // وضع الشاشة الكاملة
    document.getElementById('fullScreen').addEventListener('click', function() {
      const elem = document.querySelector('.image-frame');
      
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.mozRequestFullScreen) { /* Firefox */
          elem.mozRequestFullScreen();
        } else if (elem.webkitRequestFullscreen) { /* Chrome, Safari & Opera */
          elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) { /* IE/Edge */
          elem.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.mozCancelFullScreen) {
          document.mozCancelFullScreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) {
          document.msExitFullscreen();
        }
      }
    });
    
    // إخفاء مؤشر التمرير عند التمرير
    window.addEventListener('scroll', function() {
      const scrollIndicator = document.querySelector('.scroll-indicator');
      if (window.scrollY > 100) {
        scrollIndicator.style.opacity = '0';
      } else {
        scrollIndicator.style.opacity = '0.8';
      }
    });
  </script>
</body>
</html>
